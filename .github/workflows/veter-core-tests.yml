name: Veter Core 1.0 tests

on:
  push:
    branches: [main, veter-core-1-0-reliability]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install C++ compiler
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Run compiler regression tests
        run: python tests/test_core_1_0.py
