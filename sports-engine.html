<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>VETER Sports Arena</title><style>*{box-sizing:border-box}body{margin:0;background:#071522;color:#fff;font:15px system-ui;padding:12px}.wrap{max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}a{color:#a9f4d8}h1{margin:8px 0}.panel{background:#102b3a;border:1px solid #285064;padding:12px;border-radius:14px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select,button{border:0;border-radius:10px;padding:12px 14px;background:#c9f5a0;color:#132a20;font-weight:900}button:active{transform:scale(.97)}#action{background:#ffc65c;flex:1;min-width:140px;font-size:17px}canvas{width:100%;height:auto;display:block;border-radius:14px;background:#247b48;touch-action:none}#score{font-size:22px;font-weight:950}#msg{color:#d3e7ef;min-height:24px}.muted{color:#9fb8c7;font-size:12px}</style></head><body><main class="wrap"><a href="/sports-games.html">← Sports</a><div class="top"><h1 id="title">Sports Arena</h1><div id="score">Ready</div></div><div class="panel row"><label>Overs <select id="overs"><option>1</option><option>2</option><option selected>5</option><option>10</option></select></label><label>Mode <select id="mode"><option value="ai">Vs AI</option><option value="local">Local 2 players</option></select></label><label>View <select id="view"><option value="2d">2D</option><option value="3d">3D</option></select></label><button id="start">START GAME</button></div><div id="stage"><canvas id="game" width="900" height="540"></canvas></div><div class="panel"><div class="row"><button data-dir="left">◀ LEFT</button><button data-dir="up">▲ UP</button><button data-dir="down">▼ DOWN</button><button data-dir="right">RIGHT ▶</button><button id="action">PLAY / ACTION</button><button id="pause">Ⅱ PAUSE</button><button id="restart">↻ RESET</button></div><p id="msg">Choose a sport and press START GAME.</p><div class="muted">Keyboard: WASD / arrow keys to move, Space to act. Touch buttons work on phones.</div></div></main><script type="module">
const qs=new URLSearchParams(location.search),sport=qs.get('sport')||'cricket';let view=qs.get('view')||'2d';const $=s=>document.querySelector(s),canvas=$('#game'),ctx=canvas.getContext('2d');$('#view').value=view;$('#view').onchange=()=>{location.search='?sport='+sport+'&view='+$('#view').value};const names={cricket:'🏏 Cricket',football:'⚽ Football',kabaddi:'🤼 Kabaddi',basketball:'🏀 Basketball'};$('#title').textContent=names[sport]+' '+view.toUpperCase();let score=0,wickets=0,balls=0,maxBalls=30,target=0,started=false,paused=false,ended=false,phase='ready',ballY=110,player={x:450,y:420},aim='centre',tags=0,raidTime=0,defenders=[],keeper=450,round=0,three=null,scene=null,camera=null,renderer=null,meshPlayer=null,meshBall=null,keys={};
function msg(t){$('#msg').textContent=t}function updateScore(){let s=sport==='cricket'?score+'/'+wickets+' · '+Math.floor(balls/6)+'.'+balls%6:sport==='football'?'Goals '+score:sport==='kabaddi'?'You '+score+' · AI '+wickets:'Points '+score;$('#score').textContent=s}
function field(){let c=ctx;c.clearRect(0,0,900,540);if(sport==='cricket'){c.fillStyle='#25864a';c.fillRect(0,0,900,540);c.strokeStyle='#f5d45d';c.lineWidth=5;c.beginPath();c.ellipse(450,270,410,245,0,0,7);c.stroke();c.fillStyle='#c5a071';c.fillRect(390,65,120,410);c.strokeStyle='#fff';c.lineWidth=3;c.strokeRect(405,65,90,410);for(let x=438;x<465;x+=12){c.fillStyle='#fff';c.fillRect(x,78,5,25);c.fillRect(x,445,5,25)}for(let i=0;i<9;i++)person(90+(i%5)*180,130+Math.floor(i/5)*250,'#e14d4d');person(450,75,'#edb344');person(450,465,'#2489ef');c.fillStyle='#fff';c.font='bold 18px system-ui';c.fillText('BOWLER',405,35);c.fillText('BATTER',405,520);if(phase==='delivery'){c.fillStyle='#fff';c.beginPath();c.arc(450,ballY,10,0,7);c.fill()}}
else if(sport==='football'){c.fillStyle='#247e45';c.fillRect(0,0,900,540);c.strokeStyle='#fff';c.lineWidth=4;c.strokeRect(25,20,850,500);c.beginPath();c.moveTo(25,270);c.lineTo(875,270);c.stroke();c.strokeRect(245,20,410,150);c.strokeRect(330,20,240,75);c.fillStyle='#fff';c.fillRect(400,70,100,7);person(keeper,120,'#efb83e');person(450,390,'#2389ed');c.fillStyle='#fff';c.beginPath();c.arc(450,400,12,0,7);c.fill();c.fillStyle='#fff';c.font='bold 18px system-ui';c.fillText('GOAL',420,16)}
else if(sport==='kabaddi'){c.fillStyle='#b88757';c.fillRect(25,25,850,490);c.strokeStyle='#fff';c.lineWidth=4;c.strokeRect(25,25,850,490);c.beginPath();c.moveTo(450,25);c.lineTo(450,515);c.stroke();c.setLineDash([8,8]);c.beginPath();c.moveTo(300,25);c.lineTo(300,515);c.moveTo(600,25);c.lineTo(600,515);c.stroke();c.setLineDash([]);defenders.forEach(d=>{if(!d.out)person(d.x,d.y,'#df4848')});person(player.x,player.y,'#2188ef');c.fillStyle='#fff';c.font='bold 18px system-ui';c.fillText('YOUR HALF',80,55);c.fillText('RAIDERS vs DEFENDERS',520,55);c.fillText('MID LINE',460,45);c.fillText('RAID '+Math.max(0,30-Math.floor(raidTime))+'s',35,500)}
else{c.fillStyle='#b97543';c.fillRect(25,25,850,490);c.strokeStyle='#fff';c.lineWidth=4;c.strokeRect(25,25,850,490);c.beginPath();c.moveTo(450,25);c.lineTo(450,515);c.stroke();c.beginPath();c.arc(450,270,90,0,7);c.stroke();c.strokeRect(330,25,240,120);c.strokeStyle='#ffdb73';c.lineWidth=8;c.beginPath();c.moveTo(410,70);c.lineTo(490,70);c.stroke();c.beginPath();c.ellipse(450,90,28,10,0,0,7);c.stroke();person(player.x,player.y,'#2188ef');c.fillStyle='#f4a52f';c.beginPath();c.arc(450,360,12,0,7);c.fill();}}
function person(x,y,color){ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(x,y+14,15,6,0,0,7);ctx.fill();ctx.fillStyle=color;ctx.fillRect(x-11,y-12,22,29);ctx.fillStyle='#efc49d';ctx.beginPath();ctx.arc(x,y-20,9,0,7);ctx.fill()}
function initThree(){if(renderer)return;const script=document.createElement('script');script.type='module';script.textContent='';}
async function start3d(){try{const T=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');$('#stage').innerHTML='<div id="three" style="width:100%;height:min(65vh,560px);border-radius:14px;overflow:hidden"></div>';scene=new T.Scene();scene.background=new T.Color(sport==='kabaddi'?0xc7a078:sport==='basketball'?0xb87943:0x80b8d0);camera=new T.PerspectiveCamera(55,1,.1,100);camera.position.set(0,12,19);renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize($('#three').clientWidth,$('#three').clientHeight);$('#three').appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x53604d,2));let light=new T.DirectionalLight(0xffffff,2);light.position.set(-5,15,8);scene.add(light);let ground=new T.Mesh(new T.BoxGeometry(22,.2,30),new T.MeshStandardMaterial({color:sport==='basketball'?0xb87943:sport==='kabaddi'?0xc29a6b:0x27834b}));ground.position.y=-.15;scene.add(ground);let line=new T.GridHelper(28,18,0xffffff,0x9cc5aa);line.position.y=.01;scene.add(line);meshPlayer=new T.Mesh(new T.CapsuleGeometry(.5,1,4,8),new T.MeshStandardMaterial({color:0x237fe0}));meshPlayer.position.set(0,.8,5);scene.add(meshPlayer);meshBall=new T.Mesh(new T.SphereGeometry(.25,16,12),new T.MeshStandardMaterial({color:0xffffff}));meshBall.position.set(0,.4,-5);scene.add(meshBall);for(let i=0;i<(sport==='kabaddi'?7:4);i++){let m=new T.Mesh(new T.CapsuleGeometry(.42,.9,4,8),new T.MeshStandardMaterial({color:0xe24c4c}));m.position.set(-7+(i%4)*4,.7,-8+Math.floor(i/4)*3);scene.add(m)}function render(){requestAnimationFrame(render);if(meshPlayer){meshPlayer.position.x=(player.x-450)/35;meshPlayer.position.z=(player.y-270)/24;camera.lookAt(meshPlayer.position.x,0,meshPlayer.position.z-2);renderer.render(scene,camera)}}render();msg('3D arena ready. Move and use ACTION for this sport.')}catch(e){view='2d';$('#view').value='2d';$('#stage').innerHTML='<canvas id="game" width="900" height="540"></canvas>';location.replace('?sport='+sport+'&view=2d')}}
function reset(){score=wickets=balls=tags=round=0;maxBalls=Number($('#overs').value)*6;started=true;paused=ended=false;phase='ready';player={x:450,y:420};ballY=110;raidTime=0;defenders=Array.from({length:7},(_,i)=>({x:560+(i%3)*95,y:110+Math.floor(i/3)*150,out:false}));updateScore();msg(sport==='cricket'?'Innings started. Wait for the ball, then time your shot.':sport==='football'?'Penalty shootout started. Choose a direction and shoot.':sport==='kabaddi'?'Toss complete. You raid first. Cross the midline, tag and return.':'Move near the hoop and shoot.');if(view==='3d'){start3d()}else{field()} }
function act(){if(!started||paused||ended){msg('Start or resume the match first.');return}if(sport==='cricket'){if(phase!=='delivery'){phase='delivery';ballY=110;msg('Bowler releases the ball! Tap again as it reaches the batter.');return}if(ballY>330&&ballY<500){let r=Math.random()<.18?'W':[1,2,4,4,6][Math.floor(Math.random()*5)];if(r==='W'){wickets++;msg('WICKET! Batter is out.')}else{score+=r;msg(r===6?'SIX!':r===4?'FOUR!':r+' run(s)!')}balls++;phase='ready';if(wickets>=10||balls>=maxBalls){ended=true;msg('Innings complete!')}updateScore()}else msg('Wait for the ball to reach the batter.')}
else if(sport==='football'){let dirs={left:340,centre:450,right:560};let g=dirs[aim]!==keeper;if(g)score++;round++;msg(g?'GOAL!':'SAVED by the goalkeeper!');keeper=dirs[['left','centre','right'][Math.floor(Math.random()*3)]];if(round>=5){ended=true;msg('Penalty round complete. Final score: '+score)}updateScore()}
else if(sport==='kabaddi'){if(phase==='ready'){phase='raid';raidTime=0;tags=0;msg('Raid begins! Cross the centre line and tap ACTION near each defender.');return}if(phase==='raid'){let d=defenders.find(x=>!x.out&&player.x>450&&Math.hypot(player.x-x.x,player.y-x.y)<62);if(d){d.out=true;tags++;msg('Tagged defender! '+tags+' point(s) if you return safely.')}else msg('Move close to an opponent on their half to tag.')} }
else{if(player.y<220&&Math.abs(player.x-450)<220){score+=2;msg('BASKET! +2 points.')}else msg('Move closer to the basket, then shoot.');updateScore()}}
function move(){if(!started||paused)return;let dx=(keys.right||keys.d||keys.arrowright?1:0)-(keys.left||keys.a||keys.arrowleft?1:0),dy=(keys.down||keys.s||keys.arrowdown?1:0)-(keys.up||keys.w||keys.arrowup?1:0);player.x=Math.max(40,Math.min(860,player.x+dx*4));player.y=Math.max(45,Math.min(495,player.y+dy*4));if(sport==='cricket'&&phase==='delivery'){ballY+=5;if(ballY>510){balls++;phase='ready';if(balls>=maxBalls)ended=true;msg('Missed delivery. Next ball.');updateScore()}}if(sport==='kabaddi'&&phase==='raid'){raidTime+=1/60;if(player.x<450&&tags>0){score+=tags;tags=0;phase='ready';msg('Safe return! Raid points scored.');updateScore()}else if(player.x>450&&defenders.some(d=>!d.out&&Math.hypot(player.x-d.x,player.y-d.y)<26)){wickets++;phase='ready';player.x=170;msg('Tackled! AI earns a point.');updateScore()}else if(raidTime>30){wickets++;phase='ready';player.x=170;msg('Raid time expired. Raider out.');updateScore()}}}
function loop(){if(view==='2d'){move();field()}else if(started&&!paused){move();if(meshPlayer){meshPlayer.position.x=(player.x-450)/35;meshPlayer.position.z=(player.y-270)/24}}requestAnimationFrame(loop)}$('#start').onclick=reset;$('#restart').onclick=reset;$('#action').onclick=act;$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';msg(paused?'Game paused.':'Game resumed.')};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{aim=b.dataset.dir;let step=28;if(aim==='left')player.x-=step;if(aim==='right')player.x+=step;if(aim==='up')player.y-=step;if(aim==='down')player.y+=step});addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();act()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);if(sport==='football')keeper=450;updateScore();if(view==='2d')field();loop();
</script></body></html>
