<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07140e"><title>VETER Sports Arena</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07140e;color:#fff;font-family:system-ui,Arial}#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;z-index:2;left:0;right:0;top:0;padding:env(safe-area-inset-top) 14px 12px;background:linear-gradient(#06150edb,transparent);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.hud>*{pointer-events:auto}.brand{font-size:12px;letter-spacing:.16em;color:#a9e8c1;font-weight:900}.score{font-size:clamp(22px,4vw,34px);font-weight:1000;text-shadow:0 2px 8px #000}.meta{font-size:12px;color:#d3e8d9}.iconbtn{background:#10291dce;border:1px solid #ffffff45;color:white;border-radius:12px;padding:10px 13px;font-weight:900}.controls{position:fixed;z-index:3;left:0;right:0;bottom:0;padding:12px max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:end;pointer-events:none}.controls>*{pointer-events:auto}.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:44px 44px 44px;gap:4px}.pad button,.action{border:1px solid #ffffff66;background:#0b2019d9;color:white;border-radius:13px;font-weight:900;backdrop-filter:blur(8px);touch-action:none}.pad button{font-size:18px}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.action{background:#d8fa8b;color:#13251a;border:0;min-width:116px;min-height:74px;font-size:17px;box-shadow:0 5px 0 #71983c}.overlay{position:fixed;z-index:5;inset:0;display:grid;place-items:center;background:linear-gradient(140deg,#06170feF,#071b27ee);padding:20px}.menu{width:min(520px,100%);border:1px solid #ffffff24;border-radius:24px;padding:25px;background:linear-gradient(145deg,#183a2a,#102538);box-shadow:0 25px 80px #0009}.eyebrow{color:#b7ef90;font-size:12px;letter-spacing:.18em;font-weight:900}.menu h1{font-size:clamp(32px,7vw,52px);line-height:1;margin:10px 0}.menu p{color:#c0d5c8}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.choice{background:#ffffff10;border:1px solid #ffffff30;color:#fff;border-radius:13px;padding:13px;text-align:left;font-weight:900}.choice small{display:block;color:#bdd4c6;font-weight:500;margin-top:3px}.choice.active{border-color:#d9fa91;background:#d9fa9120}.start{width:100%;padding:16px;border:0;border-radius:14px;background:#d9fa91;color:#122419;font-size:18px;font-weight:1000}.hidden{display:none!important}.topright{display:flex;gap:8px}.result{position:fixed;z-index:4;inset:0;display:grid;place-items:center;background:#04120edb;text-align:center}.resultbox{padding:30px}.result h2{font-size:42px;margin:0 0 8px}.result button{padding:14px 25px;border:0;border-radius:12px;background:#d9fa91;font-weight:900}
@media(max-width:560px){.hud{padding-left:12px;padding-right:12px}.pad{grid-template-columns:43px 43px 43px;grid-template-rows:42px 42px 42px}.action{min-width:105px;min-height:68px}.menu{padding:20px}.meta{max-width:140px}}
</style></head><body><canvas id="game"></canvas><header class="hud"><div><div class="brand">VETER SPORTS ARENA</div><div class="score" id="score">0 — 0</div><div class="meta" id="meta">READY TO PLAY</div></div><div class="topright"><button class="iconbtn" id="pause">Ⅱ</button><button class="iconbtn" onclick="location.href='/sports-games.html'">✕</button></div></header><div class="controls"><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><button class="action" id="act">PLAY</button></div>
<div class="overlay" id="menu"><div class="menu"><div class="eyebrow">VETER ORIGINAL SPORTS</div><h1 id="menutitle">SPORTS ARENA</h1><p id="description">Choose your match settings and enter the arena.</p><div class="choices" id="settings"></div><button class="start" id="begin">KICK OFF</button></div></div><div class="result hidden" id="result"><div class="resultbox"><div class="eyebrow">FULL TIME</div><h2 id="resulttitle">MATCH OVER</h2><p id="resultscore"></p><button id="again">PLAY AGAIN</button><button id="back" style="margin-left:8px;background:#fff">SPORTS MENU</button></div></div>
<script>
(()=>{const q=new URLSearchParams(location.search),sport=q.get('sport')||'cricket',view=q.get('view')||'2d',c=document.querySelector('#game'),g=c.getContext('2d'),$=s=>document.querySelector(s);const titles={cricket:'CRICKET',football:'FOOTBALL',kabaddi:'KABADDI',basketball:'BASKETBALL'};$('#menutitle').textContent=titles[sport]+' '+view.toUpperCase();let W=1000,H=620,scale=1,score=0,opp=0,balls=0,wickets=0,maxBalls=30,phase='menu',paused=false,finished=false,keys={},held={},player={x:500,y:470,vx:0,vy:0},ball={x:500,y:150,vx:0,vy:0,r:9},keeperX=500,aim='centre',raid=0,raidClock=0,tagged=0,defenders=[],hoop=500,shotClock=0,settings={overs:5,mode:'ai'};function resize(){let d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;W=1000;H=620;g.setTransform(c.width/W,0,0,c.height/H,0,0)}addEventListener('resize',resize);resize();
function option(label,items,selected){return '<div class="choice"><span>'+label+'</span><select data-setting="'+label+'" style="display:block;margin-top:8px;width:100%;padding:8px;border-radius:8px">'+items.map(x=>'<option '+(x[0]===selected?'selected':'')+' value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>'}
function buildMenu(){let s='';if(sport==='cricket')s=option('Overs',[[1,'1 Over'],[2,'2 Overs'],[5,'5 Overs'],[10,'10 Overs'],[20,'20 Overs']],5)+option('Target',[[0,'Practice'],[10,'10 runs'],[20,'20 runs'],[30,'30 runs'],[50,'50 runs']],0);else if(sport==='football')s=option('Match',[[5,'5 Penalties'],[10,'10 Penalties']],5)+option('Mode',[['ai','Player vs AI'],['local','Two players']], 'ai');else if(sport==='kabaddi')s=option('Half length',[[5,'5 minutes'],[10,'10 minutes'],[20,'20 minutes']],10)+option('Raid first',[['you','You raid'],['ai','AI raids']], 'you');else s=option('Match time',[[60,'1 minute'],[180,'3 minutes'],[300,'5 minutes']],180)+option('Mode',[['ai','Player vs AI'],['local','Two players']], 'ai');$('#settings').innerHTML=s;$('#settings').querySelectorAll('select').forEach(el=>el.onchange=()=>{settings[el.dataset.setting]=el.value})}
buildMenu();$('#description').textContent=({cricket:'Face the bowler. Time your swing, score boundaries and protect your wickets.',football:'Take penalty kicks against the keeper. Pick a corner and beat the dive.',kabaddi:'Raid the opposite half, tag defenders and get back across the midline.',basketball:'Drive toward the hoop, get into shooting range and score baskets.'})[sport];
function person(x,y,shirt,kind='field'){g.save();g.translate(x,y);g.fillStyle='#0005';g.beginPath();g.ellipse(0,16,17,7,0,0,7);g.fill();g.strokeStyle='#eac19b';g.lineWidth=7;g.lineCap='round';g.beginPath();g.moveTo(-6,5);g.lineTo(-10,18);g.moveTo(6,5);g.lineTo(10,18);g.stroke();g.fillStyle=shirt;g.beginPath();g.roundRect(-12,-17,24,27,6);g.fill();g.fillStyle='#eac19b';g.beginPath();g.arc(0,-25,9,0,7);g.fill();g.fillStyle=kind==='keeper'?'#f4d24d':'#263d31';g.beginPath();g.arc(0,-28,9,Math.PI,Math.PI*2);g.fill();g.restore()}
function ground(){g.clearRect(0,0,W,H);if(sport==='cricket'){g.fillStyle='#247d42';g.fillRect(0,0,W,H);for(let i=0;i<10;i++){g.fillStyle=i%2?'#2b8748':'#247d42';g.fillRect(i*100,0,100,H)}g.strokeStyle='#f3d45d';g.lineWidth=5;g.beginPath();g.ellipse(500,315,455,280,0,0,7);g.stroke();g.fillStyle='#c7a274';g.beginPath();g.moveTo(438,70);g.lineTo(562,70);g.lineTo(590,560);g.lineTo(410,560);g.closePath();g.fill();g.strokeStyle='#f6e8c9';g.lineWidth=3;g.strokeRect(442,78,116,465);for(let i=0;i<3;i++){g.fillStyle='#fff';g.fillRect(480+i*13,95,5,30);g.fillRect(480+i*13,500,5,30)}[[170,180],[300,260],[700,230],[820,370],[240,440],[760,480],[390,150],[620,430],[500,90]].forEach(p=>person(p[0],p[1],'#df4e4e'));person(500,105,'#e6a83a');person(500,520,'#2389e9');if(phase==='delivery'||phase==='bowled'){g.fillStyle='#fff';g.beginPath();g.arc(ball.x,ball.y,ball.r,0,7);g.fill();g.strokeStyle='#b22';g.stroke()}}
if(sport==='football'){g.fillStyle='#247b40';g.fillRect(0,0,W,H);for(let i=0;i<10;i++){g.fillStyle=i%2?'#2c8748':'#247b40';g.fillRect(i*100,0,100,H)}g.strokeStyle='#fff';g.lineWidth=4;g.strokeRect(30,25,940,570);g.beginPath();g.moveTo(30,310);g.lineTo(970,310);g.stroke();g.strokeRect(270,25,460,170);g.strokeRect(365,25,270,90);g.strokeRect(445,25,110,8);for(let x=445;x<=550;x+=35){g.beginPath();g.moveTo(x,25);g.lineTo(x,82);g.stroke()}g.fillStyle='#fff';g.beginPath();g.arc(500,410,9,0,7);g.fill();person(keeperX,130,'#f1b93e','keeper');person(500,490,'#2389e9');g.fillStyle='#fff';g.font='bold 20px system-ui';g.fillText('PENALTY SHOOTOUT',30,50)}
if(sport==='kabaddi'){g.fillStyle='#b9895a';g.fillRect(25,25,950,570);g.fillStyle='#c69b6e';g.fillRect(35,35,930,550);g.strokeStyle='#fff';g.lineWidth=4;g.strokeRect(35,35,930,550);g.beginPath();g.moveTo(500,35);g.lineTo(500,585);g.stroke();g.setLineDash([8,8]);g.beginPath();g.moveTo(340,35);g.lineTo(340,585);g.moveTo(660,35);g.lineTo(660,585);g.stroke();g.setLineDash([]);g.fillStyle='#fff';g.font='bold 19px system-ui';g.fillText('YOUR HALF',100,70);g.fillText('OPPONENT HALF',730,70);defenders.forEach(d=>{if(!d.out)person(d.x,d.y,'#d94343')});person(player.x,player.y,'#2389e9')}
if(sport==='basketball'){g.fillStyle='#b97643';g.fillRect(25,25,950,570);g.fillStyle='#c9834e';g.fillRect(35,35,930,550);g.strokeStyle='#fff';g.lineWidth=4;g.strokeRect(35,35,930,550);g.beginPath();g.moveTo(500,35);g.lineTo(500,585);g.stroke();g.beginPath();g.arc(500,310,100,0,7);g.stroke();g.strokeRect(350,35,300,160);g.strokeRect(395,35,210,95);g.strokeStyle='#f6d47a';g.lineWidth=8;g.beginPath();g.moveTo(450,90);g.lineTo(550,90);g.stroke();g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.ellipse(500,112,30,10,0,0,7);g.stroke();person(500,155,'#df4e4e');person(player.x,player.y,'#2389e9');g.fillStyle='#f1a12b';g.beginPath();g.arc(ball.x,ball.y,12,0,7);g.fill();g.strokeStyle='#75451d';g.stroke()}}
function updateHUD(){let txt=sport==='cricket'?score+'/'+wickets+' <small>RUNS / WKTS</small>':sport==='football'?score+' <small>GOALS</small>':sport==='kabaddi'?score+' — '+opp+' <small>POINTS</small>':score+' <small>POINTS</small>';$('#score').innerHTML=txt;$('#meta').textContent=sport==='cricket'?Math.floor(balls/6)+'.'+balls%6+' OVERS':sport==='kabaddi'?'RAID '+Math.max(0,30-Math.floor(raidClock))+'s':'VETER MATCH'}
function begin(){score=opp=balls=wickets=raid=raidClock=tagged=0;maxBalls=(sport==='cricket'?Number(settings.Overs||5)*6:30);finished=paused=false;phase='ready';player={x:sport==='kabaddi'?220:500,y:sport==='cricket'?520:sport==='basketball'?470:490};ball={x:500,y:140,vx:0,vy:0,r:10};keeperX=500;defenders=Array.from({length:7},(_,i)=>({x:690+(i%3)*75,y:130+Math.floor(i/3)*170,out:false,homeX:690+(i%3)*75,homeY:130+Math.floor(i/3)*170}));$('#menu').classList.add('hidden');$('#result').classList.add('hidden');$('#act').textContent=sport==='cricket'?'SWING':sport==='football'?'SHOOT':sport==='kabaddi'?'TAG':'SHOOT';if(sport==='cricket')phase='waiting';updateHUD()}
function endMatch(title){finished=true;phase='end';$('#resulttitle').textContent=title;$('#resultscore').textContent=sport==='cricket'?score+' runs · '+wickets+' wickets':sport==='kabaddi'?score+' — '+opp+' points':score+' score';$('#result').classList.remove('hidden')}
function act(){if(phase==='menu'||finished||paused)return;if(sport==='cricket'){if(phase==='waiting'){phase='delivery';ball={x:500+Math.random()*35-17,y:130,vx:(Math.random()-.5)*1.3,vy:7.3,r:10};}else if(phase==='delivery'&&ball.y>400&&ball.y<535){let timing=Math.abs(ball.y-475),r=timing<24?(Math.random()<.55?6:4):timing<65?[1,2,4][Math.floor(Math.random()*3)]:Math.random()<.25?'W':0;if(r==='W'){wickets++;}else score+=r;balls++;phase='waiting';if(wickets>=10||balls>=maxBalls)endMatch('INNINGS OVER')} }
else if(sport==='football'){let corners=['left','centre','right'];let keeper= Math.random()<.38?aim:corners[Math.floor(Math.random()*3)];if(aim!==keeper)score++;else opp++;round++;if(round>=5)endMatch(score>opp?'YOU WIN':score<opp?'AI WINS':'DRAW');else $('#meta').textContent='KICK '+round+' / 5 · AIM '+aim.toUpperCase()}
else if(sport==='kabaddi'){if(phase==='ready'){phase='raid';raidClock=0;tagged=0;return}if(phase==='raid'){let d=defenders.find(d=>!d.out&&Math.hypot(player.x-d.x,player.y-d.y)<65);if(d){d.out=true;tagged++;$('#meta').textContent='TOUCH! '+tagged+' DEFENDER(S)';}}}
else if(sport==='basketball'){let dist=Math.hypot(player.x-500,player.y-130);if(dist<300){score+=dist<180?3:2;ball={x:500,y:110,vx:0,vy:0,r:12};player={x:500,y:420};}else $('#meta').textContent='GET CLOSER TO THE HOOP';}
updateHUD()}
function move(){if(paused||finished||phase==='menu')return;let dx=(keys.right||keys.d||keys.arrowright?1:0)-(keys.left||keys.a||keys.arrowleft?1:0),dy=(keys.down||keys.s||keys.arrowdown?1:0)-(keys.up||keys.w||keys.arrowup?1:0);if(sport==='football'){if(dx<0)aim='left';else if(dx>0)aim='right';else aim='centre';return}let speed=sport==='kabaddi'?3.4:4.3;player.x=Math.max(45,Math.min(955,player.x+dx*speed));player.y=Math.max(65,Math.min(570,player.y+dy*speed));if(sport==='cricket'&&phase==='delivery'){ball.x+=ball.vx;ball.y+=ball.vy;if(ball.y>560){balls++;phase='waiting';if(balls>=maxBalls)endMatch('INNINGS OVER')}}if(sport==='kabaddi'&&phase==='raid'){raidClock+=1/60;defenders.forEach(d=>{if(d.out)return;let dist=Math.hypot(player.x-d.x,player.y-d.y);if(dist<190){d.x+=(player.x>d.x?-1:1)*1.15;d.y+=(player.y-d.y)/Math.max(1,dist)*1.15}});if(player.x<500&&tagged>0){score+=tagged;tagged=0;phase='ready';defenders.forEach(d=>d.out=false);$('#meta').textContent='SAFE RAID · POINTS WON'}else if(player.x>500&&defenders.some(d=>!d.out&&Math.hypot(player.x-d.x,player.y-d.y)<24)){opp++;phase='ready';tagged=0;player.x=220;defenders.forEach(d=>d.out=false);$('#meta').textContent='TACKLED · DEFENCE POINT'}else if(raidClock>30){opp++;phase='ready';tagged=0;player.x=220;defenders.forEach(d=>d.out=false);$('#meta').textContent='RAID TIME OUT'}updateHUD()}}
function draw(){ground();if(sport==='cricket'&&phase==='delivery'){g.fillStyle='#fff';g.beginPath();g.arc(ball.x,ball.y,ball.r,0,7);g.fill();g.strokeStyle='#c22';g.stroke()}if(sport==='football'){g.fillStyle='#fff';g.beginPath();g.arc(500,410,10,0,7);g.fill();g.strokeStyle='#222';g.stroke();g.fillStyle='#d8fa91';g.font='bold 17px system-ui';g.fillText('AIM: '+aim.toUpperCase(),30,85)}if(paused){g.fillStyle='#04130dbb';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.textAlign='center';g.font='900 48px system-ui';g.fillText('PAUSED',500,320);g.textAlign='left'}}
function frame(){move();draw();requestAnimationFrame(frame)}
$('#begin').onclick=begin;$('#again').onclick=begin;$('#back').onclick=()=>location.href='/sports-games.html';$('#pause').onclick=()=>{if(phase==='menu'||finished)return;paused=!paused;$('#pause').textContent=paused?'▶':'Ⅱ'};$('#act').onclick=act;document.querySelectorAll('[data-dir]').forEach(b=>{let k=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();act()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);if(sport==='football'){document.querySelector('.pad .up').textContent='↖';document.querySelector('.pad .down').textContent='↘'}updateHUD();frame();
})();
</script></body></html>
