<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>VETER 3D Sports Games</title><style>*{box-sizing:border-box}body{margin:0;background:#07121d;color:#fff;font:15px system-ui}#scene{position:fixed;inset:0}#ui{position:fixed;inset:10px;pointer-events:none}#panel{pointer-events:auto;display:inline-flex;flex-wrap:wrap;align-items:center;gap:7px;max-width:min(680px,95vw);background:#061521dd;padding:10px;border-radius:13px}select,button{pointer-events:auto;padding:11px 13px;border:0;border-radius:10px;background:#a8f0dc;color:#123;font-weight:900}#score{font-weight:900}#msg{font-size:13px;color:#e0f7ef;width:100%}#act{position:absolute;right:10px;bottom:20px;padding:20px 23px;font-size:16px}#pad{position:absolute;left:8px;bottom:15px;display:grid;grid-template-columns:repeat(3,48px);gap:5px;pointer-events:auto}#pad button{background:#17394d;color:white;touch-action:none}#aim{position:absolute;right:10px;bottom:95px;display:flex;gap:4px;pointer-events:auto}#aim button{padding:9px}a{color:#a8f0dc;pointer-events:auto}</style></head><body><div id="scene"></div><div id="ui"><div id="panel"><a href="/games.html">← Games</a><select id="sport"><option value="cricket">Cricket 3D batting</option><option value="football">Football 3D penalties</option><option value="kabaddi">Kabaddi 3D raid</option><option value="basketball">Basketball 3D</option></select><span id="score">Runs 0/0 · 0.0</span><div id="msg">Choose a sport. Move with controls and tap the action button.</div></div><div id="pad"><button data-k="w">▲</button><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div><div id="aim"><button data-aim="left">LEFT</button><button data-aim="centre">CENTRE</button><button data-aim="right">RIGHT</button></div><button id="act">PLAY / ACTION</button></div><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';const host=document.querySelector('#scene'),scene=new T.Scene();scene.background=new T.Color(0x83b9d0);const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);camera.position.set(0,13,20);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);host.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x52645b,2));const sun=new T.DirectionalLight(0xffffff,2);sun.position.set(-5,15,9);scene.add(sun);const ground=new T.Mesh(new T.BoxGeometry(24,.3,34),new T.MeshStandardMaterial({color:0x31945b}));ground.position.y=-.2;scene.add(ground);const lines=new T.GridHelper(34,22,0xffffff,0xa8d8ba);lines.position.y=.01;scene.add(lines);const player=new T.Group();const body=new T.Mesh(new T.CapsuleGeometry(.48,.9,4,8),new T.MeshStandardMaterial({color:0x237fe0}));body.position.y=.85;player.add(body);const head=new T.Mesh(new T.SphereGeometry(.3),new T.MeshStandardMaterial({color:0xffd0a5}));head.position.y=1.62;player.add(head);scene.add(player);const ball=new T.Mesh(new T.SphereGeometry(.25,20,16),new T.MeshStandardMaterial({color:0xf4f2e9}));scene.add(ball);const opponentGroup=new T.Group();scene.add(opponentGroup);const goal=new T.Mesh(new T.BoxGeometry(5,.15,.25),new T.MeshStandardMaterial({color:0xffffff}));goal.position.set(0,2,-13);scene.add(goal);const hoop=new T.Mesh(new T.TorusGeometry(.8,.08,8,32),new T.MeshStandardMaterial({color:0xff6b35}));hoop.position.set(0,3,-11);scene.add(hoop);let keys={},sport='cricket',runs=0,wickets=0,legal=0,score=0,phase='ready',ballMoving=false,aim='centre',raidSecs=0,tagged=0,paused=false;let defenders=[];function text(s){document.querySelector('#msg').textContent=s}function scoreText(){let s=sport==='cricket'?'Runs '+runs+'/'+wickets+' · '+Math.floor(legal/6)+'.'+legal%6:sport==='football'?'Goals '+score:sport==='kabaddi'?'You '+score+' · Raid tags '+tagged:'Points '+score;document.querySelector('#score').textContent=s}function clearOpp(){while(opponentGroup.children.length)opponentGroup.remove(opponentGroup.children[0]);defenders=[]}function makePerson(x,z,color=0xe64d4d){let m=new T.Mesh(new T.CapsuleGeometry(.42,.8,4,8),new T.MeshStandardMaterial({color}));m.position.set(x,.65,z);opponentGroup.add(m);return m}function reset(){sport=document.querySelector('#sport').value;runs=wickets=legal=score=tagged=raidSecs=0;phase='ready';ballMoving=false;paused=false;player.position.set(0,0,5);ball.position.set(0,.4,-5);clearOpp();ground.material.color.set(sport==='basketball'?0xb87943:sport==='kabaddi'?0xc99b65:0x31945b);hoop.visible=sport==='basketball';goal.visible=sport==='football';if(sport==='cricket'){for(let i=0;i<3;i++){let stump=new T.Mesh(new T.BoxGeometry(.08,.8,.08),new T.MeshStandardMaterial({color:0xf5e7c7}));stump.position.set((i-1)*.22,.4,-7);scene.add(stump)}for(let i=0;i<5;i++)makePerson(-7+i*3,-12,0x303c4f);text('Cricket batting: tap BAT when the delivery reaches you. Six legal balls per over; 10 wickets end the innings.')}else if(sport==='football'){for(let i=0;i<3;i++)makePerson((i-1)*1.7,-12,0x303c4f);text('Penalty: choose LEFT/CENTRE/RIGHT, then SHOOT. The keeper tries to save.')}else if(sport==='kabaddi'){for(let i=0;i<7;i++){let d=makePerson(-7+(i%4)*4,-8+Math.floor(i/4)*3,0xe64d4d);defenders.push(d)}text('Kabaddi: cross the centre line, tag defenders with ACTION nearby, then return to your half. Raid limit 30 seconds.')}else{hoop.visible=true;text('Basketball: move close to the hoop and tap SHOOT for a basket.')}scoreText()}function action(){if(paused)return;if(sport==='cricket'){if(!ballMoving){if(phase==='ready'){ballMoving=true;phase='delivery';ball.position.set((Math.random()-.5)*1.5,.45,-13);text('Bowler delivers! Wait until the ball approaches your batter.')}else return}else{let dist=player.position.distanceTo(ball.position);if(dist<3.3){let r=dist<1.3?(Math.random()<.35?6:4):Math.random()<.45?2:1;runs+=r;legal++;text('Good timing! '+r+' runs.');ballMoving=false;phase='ready';if(legal>=120||wickets>=10){text('Innings complete: '+runs+'/'+wickets)}else ball.position.set(0,.4,-5)}else if(ball.position.z>-3){wickets++;legal++;ballMoving=false;phase='ready';text('Bowled / missed — wicket!');ball.position.set(0,.4,-5)}else text('Wait for the ball to get closer to the bat.')} }else if(sport==='football'){let keeper=defenders[0];let dist=Math.abs(player.position.x-ball.position.x);if(dist>7){text('Move to the penalty spot first.');return}let save=Math.random()<.42; if(!save){score++;text('GOAL!')}else text('Keeper saved it. Try another direction.');ball.position.set(0,.4,-5);player.position.set(0,0,5)}else if(sport==='kabaddi'){if(phase==='ready'){phase='raid';raidSecs=0;tagged=0;text('Raid started! Cross centre line and tag defenders.')}else if(phase==='raid'){let d=defenders.find(v=>v.visible&&v.position.distanceTo(player.position)<2.2);if(d){d.visible=false;tagged++;text('Touch! '+tagged+' defender(s) tagged. Return to your half!')}else text('No defender in reach. Get closer to tag.')}}else{if(player.position.distanceTo(hoop.position)<9){score+=2;text('Basket! +2 points.')}else text('Move closer to the hoop before shooting.')}scoreText()}document.querySelector('#act').onclick=action;document.querySelector('#sport').onchange=reset;document.querySelectorAll('[data-aim]').forEach(b=>b.onclick=()=>{aim=b.dataset.aim;text('Aim set '+aim.toUpperCase()+'. Press action.');});addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();action()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[k]=false))});let clock=0;function loop(){requestAnimationFrame(loop);if(!paused){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);player.position.x=T.MathUtils.clamp(player.position.x+dx*.12,-10,10);player.position.z=T.MathUtils.clamp(player.position.z+dz*.12,-15,15);if(ballMoving){ball.position.z+=.16;if(ball.position.z>-2){ballMoving=false;wickets++;legal++;text('Missed delivery — wicket.');ball.position.set(0,.4,-5);scoreText()}}if(sport==='kabaddi'&&phase==='raid'){raidSecs+=1/60;if(player.position.z<0&&defenders.some(d=>d.visible&&d.position.distanceTo(player.position)<1.05)){phase='ready';scoreText();text('Tackled! AI earns 1 point. Raid ends.');score=Math.max(0,score-0);player.position.set(0,0,5)}else if(player.position.z>1&&tagged>0){score+=tagged;phase='ready';text('Safe return! '+tagged+' touch points scored.');defenders.forEach(d=>d.visible=true)}else if(raidSecs>30){phase='ready';text('30-second raid ended. Raider is out.');defenders.forEach(d=>d.visible=true)}scoreText()}if(sport==='football'&&defenders[0])defenders[0].position.x=Math.sin(clock*.025)*2.2;clock++}camera.position.lerp(new T.Vector3(player.position.x,12,player.position.z+19),.045);camera.lookAt(player.position.x,.5,player.position.z-3);renderer.render(scene,camera)}document.querySelector('#pause')?.addEventListener('click',()=>paused=!paused);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});reset();loop();</script></body></html>
