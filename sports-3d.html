<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VETER 3D Sports Stadium</title><style>body{margin:0;background:#07121d;color:white;font:15px system-ui}#scene{position:fixed;inset:0}#ui{position:fixed;inset:12px;pointer-events:none}select,button{pointer-events:auto;padding:13px;border:0;border-radius:10px;background:#a8f0dc;color:#123;font-weight:bold}#act{position:absolute;right:10px;bottom:20px;padding:20px}#pad{position:absolute;left:8px;bottom:15px;display:grid;grid-template-columns:repeat(3,50px);gap:5px}#pad button{background:#17394d;color:white}#msg{background:#061521cc;padding:10px;border-radius:10px;display:inline-block}</style></head><body><div id="scene"></div><div id="ui"><div id="msg">🏟️ VETER 3D Sports Stadium<br><select id="sport"><option value="cricket">Cricket</option><option value="football">Football</option><option value="basketball">Basketball</option><option value="kabaddi">Kabaddi</option></select><span id="score">Score: 0</span></div><div id="pad"><button data-k="w">▲</button><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div><button id="act">PLAY</button></div><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';const scene=new T.Scene();scene.background=new T.Color(0x83b9d0);const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);camera.position.set(0,13,19);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.querySelector('#scene').appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x53665b,2));let sun=new T.DirectionalLight(0xffffff,2);sun.position.set(-5,12,7);scene.add(sun);const floor=new T.Mesh(new T.BoxGeometry(22,.3,30),new T.MeshStandardMaterial({color:0x31945b}));floor.position.y=-.2;scene.add(floor);scene.add(new T.GridHelper(30,20,0xffffff,0xa8d8ba));for(let x of [-13,13]){let stand=new T.Mesh(new T.BoxGeometry(4,3,30),new T.MeshStandardMaterial({color:0x344b69}));stand.position.set(x,1,0);scene.add(stand)}const player=new T.Group();let body=new T.Mesh(new T.CapsuleGeometry(.5,.9,4,8),new T.MeshStandardMaterial({color:0x237fe0}));body.position.y=.8;player.add(body);let head=new T.Mesh(new T.SphereGeometry(.32),new T.MeshStandardMaterial({color:0xffd0a5}));head.position.y=1.65;player.add(head);scene.add(player);const ball=new T.Mesh(new T.SphereGeometry(.38,20,16),new T.MeshStandardMaterial({color:0xffa52e}));ball.position.set(0,.5,-4);scene.add(ball);const hoop=new T.Mesh(new T.TorusGeometry(1,.09,8,32),new T.MeshStandardMaterial({color:0xff6b35}));hoop.position.set(0,3,-10);scene.add(hoop);let keys={},score=0;function setup(){let v=document.querySelector('#sport').value;floor.material.color.set(v==='basketball'?0xb87943:v==='kabaddi'?0xc99b65:0x31945b);hoop.visible=v==='basketball';score=0;document.querySelector('#score').textContent='Score: 0';player.position.set(0,0,4);ball.position.set(0,.5,-4)}document.querySelector('#sport').onchange=setup;function action(){score+=document.querySelector('#sport').value==='basketball'?2:1;document.querySelector('#score').textContent='Score: '+score;ball.position.set((Math.random()-.5)*5,1,-8)}document.querySelector('#act').onclick=action;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')action()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[k]=false))});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function loop(){requestAnimationFrame(loop);player.position.x=T.MathUtils.clamp(player.position.x+((keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0))*.13,-9,9);player.position.z=T.MathUtils.clamp(player.position.z+((keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0))*.13,-12,12);ball.rotation.x+=.02;ball.rotation.y+=.03;camera.position.lerp(new T.Vector3(player.position.x,13,player.position.z+19),.04);camera.lookAt(player.position.x,0,player.position.z-2);renderer.render(scene,camera)}setup();loop();</script></body></html>
