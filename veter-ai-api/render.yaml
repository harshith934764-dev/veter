services:
  - type: web
    name: veter-ai-api
    runtime: python
    rootDir: veter-ai-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: VETER_AI_MODEL
        value: openai/gpt-4o-mini
      - key: APP_ORIGINS
        value: https://theveter.in,https://www.theveter.in
