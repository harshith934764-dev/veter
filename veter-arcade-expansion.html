<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111d"><title>VETER Arcade Expansion — Four More Games</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111d;color:#eef7ff;font:16px system-ui}.wrap{max-width:960px;width:94%;margin:auto}.top{padding:20px 0;border-bottom:1px solid #29445c;display:flex;justify-content:space-between}.top a{color:#72ead8;text-decoration:none}.hero{padding:28px 0}.hero h1{font-size:clamp(32px,6vw,52px);margin:6px 0}.hero p,.hint{color:#a9bed0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,button{background:#102238;color:#eef7ff;border:1px solid #29445c;border-radius:14px;padding:14px;cursor:pointer}.card{text-align:left}.card.active{border-color:#72ead8}.card b{display:block;margin:8px 0}.play{margin:18px 0 40px;background:#0b1b2c;border:1px solid #29445c;border-radius:18px;padding:16px}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.bar button{background:#72ead8;color:#07111d;font-weight:800}.board{min-height:380px;background:#030b14;border-radius:12px;margin-top:14px;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}.ttt{display:grid;grid-template-columns:repeat(3,90px);gap:6px}.ttt button{height:90px;font-size:38px}.memory{display:grid;grid-template-columns:repeat(4,70px);gap:8px}.memory button{height:70px;font-size:28px}.answers{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.answers button{min-width:100px;font-size:22px}.big{font-size:clamp(28px,6vw,48px);font-weight:900}.hint{text-align:center;padding:10px}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.board{min-height:330px}.ttt{grid-template-columns:repeat(3,78px)}.ttt button{height:78px}.memory{grid-template-columns:repeat(4,60px)}.memory button{height:60px}}
</style></head><body><header class="top wrap"><a href="/">VETER ARCADE</a><a href="/veter-2d-games.html">← Previous 8 games</a></header><main class="wrap"><section class="hero"><div style="color:#72ead8;font-weight:900;letter-spacing:.15em">ARCADE EXPANSION · 4 NEW GAMES</div><h1>More games. Same VETER.</h1><p>Four extra playable mini-games. This is an addition — the original eight games stay untouched.</p></section>
<section class="cards"><button class="card active" data-game="ttt">❎<b>Tic-Tac-Toe</b><small>Two players, one board</small></button><button class="card" data-game="memory">🧠<b>Memory Match</b><small>Find all pairs</small></button><button class="card" data-game="reaction">⚡<b>Reaction Test</b><small>Test your speed</small></button><button class="card" data-game="math">➗<b>Math Sprint</b><small>Quick number quiz</small></button></section>
<section class="play"><div class="bar"><div><strong id="name">Tic-Tac-Toe</strong><div class="hint" id="status">X starts</div></div><button id="restart">↻ Restart game</button></div><div class="board" id="board"></div></section></main>
<script>
const board=document.querySelector('#board'),statusEl=document.querySelector('#status'),nameEl=document.querySelector('#name');let game='ttt',cells=[],turn='X',over=false,deck=[],opened=[],locked=false,phase='wait',started=0,mathValue=0;
const names={ttt:'Tic-Tac-Toe',memory:'Memory Match',reaction:'Reaction Test',math:'Math Sprint'};
function choose(id){game=id;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active',c.dataset.game===id));nameEl.textContent=names[id];reset()}
function reset(){over=false;if(game==='ttt'){cells=Array(9).fill('');turn='X';renderTtt()}if(game==='memory'){let a=['🍎','🍋','🍇','🍒','⭐','🚀','🐱','⚽'];deck=[...a,...a].sort(()=>Math.random()-.5);opened=[];locked=false;renderMemory()}if(game==='reaction'){phase='wait';board.innerHTML='<div class="big">Wait for green…</div>';statusEl.textContent='Tap only after the panel turns green';setTimeout(()=>{if(game==='reaction'&&phase==='wait'){phase='go';started=performance.now();board.innerHTML='<button class="big" style="background:#16704f;padding:70px" id="react">TAP NOW!</button>';document.querySelector('#react').onclick=reactClick}},1200+Math.random()*2800)}if(game==='math')newQuestion()}
function renderTtt(){board.innerHTML='<div class="ttt">'+cells.map((v,i)=>'<button data-i="'+i+'">'+v+'</button>').join('')+'</div>';board.querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(cells[i]||over)return;cells[i]=turn;let wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let win=wins.some(w=>w.every(n=>cells[n]===turn));if(win){over=true;statusEl.textContent=turn+' wins!'}else if(cells.every(Boolean)){over=true;statusEl.textContent='Draw!'}else{turn=turn==='X'?'O':'X';statusEl.textContent=turn+' turn'}renderTtt()})}
function renderMemory(){board.innerHTML='<div class="memory">'+deck.map((v,i)=>'<button data-i="'+i+'">'+(opened.includes(i)||deck[i]===null?v:'?')+'</button>').join('')+'</div>';board.querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(locked||opened.includes(i)||deck[i]===null)return;opened.push(i);renderMemory();if(opened.length===2){let [a,c]=opened;if(deck[a]===deck[c]){deck[a]=deck[c]=null;opened=[];statusEl.textContent='Match!'}else{locked=true;setTimeout(()=>{opened=[];locked=false;renderMemory()},650)}if(deck.every(v=>v===null))statusEl.textContent='You found every pair!' }})}
function reactClick(){if(phase!=='go')return;let ms=Math.round(performance.now()-started);phase='done';board.innerHTML='<div><div class="big">'+ms+' ms</div><p>Reaction time</p><button id="again">Try again</button></div>';document.querySelector('#again').onclick=reset;statusEl.textContent=ms<250?'Lightning fast!':'Nice try — beat your time!'}
function newQuestion(){let a=3+Math.floor(Math.random()*17),b=2+Math.floor(Math.random()*12);mathValue=a+b;let opts=new Set([mathValue]);while(opts.size<4)opts.add(mathValue+Math.floor(Math.random()*15)-7);let choices=[...opts].sort(()=>Math.random()-.5);board.innerHTML='<div><div class="big">'+a+' + '+b+' = ?</div><div class="answers">'+choices.map(v=>'<button data-v="'+v+'">'+v+'</button>').join('')+'</div></div>';statusEl.textContent='Choose the correct answer';board.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(+b.dataset.v===mathValue){statusEl.textContent='Correct! Next one…';newQuestion()}else{statusEl.textContent='Not quite. Try another question.';b.disabled=true}})}
document.querySelectorAll('.card').forEach(b=>b.onclick=()=>choose(b.dataset.game));document.querySelector('#restart').onclick=reset;reset();
</script></body></html>
