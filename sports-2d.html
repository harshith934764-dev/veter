<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>VETER Basketball & Kabaddi 2D</title><style>*{box-sizing:border-box}body{margin:0;background:#10271e;color:white;font:16px system-ui;padding:14px;display:grid;place-items:center;min-height:100vh}.box{width:min(850px,100%);background:#183b2b;padding:16px;border-radius:18px}a{color:#b5f3d0}canvas{width:100%;background:#b87943;border-radius:12px;touch-action:none}button,select{padding:12px;border:0;border-radius:9px;font-weight:bold;margin:4px;background:#d9f99d;color:#123}#score{font-size:22px;font-weight:bold}.hint{color:#cbe5d5}</style></head><body><main class="box"><a href="/games.html">← Games</a><h1 id="title">🏀 Basketball 2D</h1><select id="mode"><option value="basketball">Basketball</option><option value="kabaddi">Kabaddi</option></select><div id="score">Score: 0</div><canvas id="c" width="800" height="440"></canvas><div><button data-k="up">▲</button><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button><button id="act">SHOOT</button><button id="reset">Restart</button></div><p class="hint" id="hint">Move close to the hoop and shoot. Use arrows/WASD or touch buttons.</p></main><script>(()=>{let c=document.querySelector('#c'),g=c.getContext('2d'),p={x:400,y:350},keys={},score=0,mode=document.querySelector('#mode'),hint=document.querySelector('#hint');mode.value=new URLSearchParams(location.search).get('sport')==='kabaddi'?'kabaddi':'basketball';function draw(){g.fillStyle=mode.value==='basketball'?'#bd7845':'#27834d';g.fillRect(0,0,800,440);g.strokeStyle='white';g.lineWidth=4;g.strokeRect(25,20,750,400);g.beginPath();if(mode.value==='basketball'){g.arc(400,100,28,0,7);g.stroke();g.strokeRect(320,20,160,95)}else{g.moveTo(400,20);g.lineTo(400,420);g.stroke();g.strokeRect(25,140,750,160)}g.fillStyle='#ffd166';g.beginPath();g.arc(400,240,12,0,7);g.fill();g.fillStyle='#2387df';g.beginPath();g.arc(p.x,p.y,20,0,7);g.fill();g.fillStyle='white';g.font='bold 20px system-ui';g.fillText(mode.value.toUpperCase()+' · '+score,20,32)}function loop(){let dx=(keys.right||keys.d||keys.arrowright?1:0)-(keys.left||keys.a||keys.arrowleft?1:0),dy=(keys.down||keys.s||keys.arrowdown?1:0)-(keys.up||keys.w||keys.arrowup?1:0);p.x=Math.max(45,Math.min(755,p.x+dx*3));p.y=Math.max(45,Math.min(395,p.y+dy*3));draw();requestAnimationFrame(loop)}function act(){if(mode.value==='basketball'){if(Math.hypot(p.x-400,p.y-100)<190){score+=2;hint.textContent='Basket! +2 points!'}else hint.textContent='Move closer to the hoop.'}else{if(Math.abs(p.x-400)<100){score++;hint.textContent='Raid point! +1'}else hint.textContent='Cross the centre line first.'}document.querySelector('#score').textContent='Score: '+score}document.querySelector('#act').onclick=act;document.querySelector('#reset').onclick=()=>{score=0;p={x:400,y:350};document.querySelector('#score').textContent='Score: 0'};mode.onchange=()=>{document.querySelector('#title').textContent=mode.value==='basketball'?'🏀 Basketball 2D':'🤼 Kabaddi 2D';document.querySelector('#act').textContent=mode.value==='basketball'?'SHOOT':'RAID';document.querySelector('canvas').style.background=mode.value==='basketball'?'#bd7845':'#27834d'};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')act()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[k]=false))});loop()})();</script></body></html>
