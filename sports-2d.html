<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kabaddi & Basketball 2D</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#071a13;color:white;font:15px system-ui;display:grid;place-items:center;min-height:100vh}.game{width:min(980px,100%);background:#102b20;border:1px solid #28533d;border-radius:18px;padding:12px}a{color:#b8f2d2}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.score{font-size:22px;font-weight:900}canvas{width:100%;height:auto;display:block;margin-top:10px;border-radius:14px;touch-action:none}.panel{background:#17412e;border-radius:13px;padding:12px;margin-top:10px}.row{display:flex;gap:7px;flex-wrap:wrap}button,select{border:0;border-radius:10px;padding:12px 15px;background:#d9fa91;color:#142c1c;font-weight:900}#act{background:#ffc65c;flex:1}#msg{color:#d7eddf;min-height:24px}.small{color:#b8d5c3;font-size:13px}</style></head><body><main class="game"><a href="/games.html">← Games</a><div class="top"><h1 id="title">🤼 Kabaddi 2D</h1><div id="score" class="score">YOU 0 — 0 AI</div></div><div class="panel row"><label>Sport <select id="mode"><option value="kabaddi">Kabaddi · 7 vs 7</option><option value="basketball">Basketball · 1 vs 1</option></select></label><label>Raid first <select id="toss"><option value="you">You</option><option value="ai">AI</option></select></label><button id="start">START / TOSS</button></div><canvas id="c" width="900" height="540"></canvas><div class="panel"><div class="row"><button data-k="up">▲</button><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button><button id="act">RAID / TAG</button><button id="pause">Ⅱ Pause</button><button id="reset">↻ Restart</button></div><p id="msg">Kabaddi: cross the midline, tag defenders and return safely. Basketball: move, dribble and shoot.</p><div class="small">Move with arrow keys/WASD or touch buttons. Kabaddi: tag defenders on the opponent half, then return before the raid timer ends. Basketball: shoot near the hoop.</div></div></main><script>(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),mode=document.querySelector('#mode'),scoreEl=document.querySelector('#score'),msg=document.querySelector('#msg'),keys={};let you=0,ai=0,p={x:170,y:270},bots=[],phase='ready',turn='you',paused=false,started=false,seconds=0,tags=0,ball={x:450,y:270},basketBall={x:450,y:300},shotAnim=0;function drawPerson(x,y,color,label,scale=1){g.save();g.translate(x,y);g.scale(scale,scale);g.fillStyle='#0004';g.beginPath();g.ellipse(0,17,16,6,0,0,7);g.fill();g.fillStyle=color;g.beginPath();g.roundRect(-12,-13,24,30,7);g.fill();g.fillStyle='#efc49e';g.beginPath();g.arc(0,-22,9,0,7);g.fill();g.fillStyle='#fff';g.font='bold 11px system-ui';g.textAlign='center';g.fillText(label,0,5);g.restore()}function score(){scoreEl.textContent='YOU '+you+' — '+ai+' AI'}function kabaddiCourt(){g.fillStyle='#b98550';g.fillRect(0,0,900,540);g.fillStyle='#c99a68';g.fillRect(25,25,850,490);g.strokeStyle='#fff';g.lineWidth=4;g.strokeRect(25,25,850,490);g.beginPath();g.moveTo(450,25);g.lineTo(450,515);g.stroke();g.setLineDash([9,8]);g.beginPath();g.moveTo(300,25);g.lineTo(300,515);g.moveTo(600,25);g.lineTo(600,515);g.stroke();g.setLineDash([]);g.beginPath();g.moveTo(25,270);g.lineTo(875,270);g.strokeStyle='#ffffff88';g.stroke();g.fillStyle='white';g.font='bold 18px system-ui';g.fillText('YOUR HALF',95,55);g.fillText('OPPONENT HALF',665,55);g.font='bold 14px system-ui';g.fillText('MID LINE',458,45);g.fillText('BAULK LINE',310,45);bots.forEach((b,i)=>{if(b.out)return;drawPerson(b.x,b.y,'#c83d43','D'+(i+1),1.05)});drawPerson(p.x,p.y,'#237de1','YOU',1.2);g.fillStyle='white';g.font='bold 17px system-ui';g.fillText('RAID: '+Math.max(0,30-Math.floor(seconds))+'s',25,535)}function basketballCourt(){g.fillStyle='#bd7541';g.fillRect(0,0,900,540);g.fillStyle='#c9834e';g.fillRect(25,25,850,490);g.strokeStyle='#fff';g.lineWidth=4;g.strokeRect(25,25,850,490);g.beginPath();g.moveTo(450,25);g.lineTo(450,515);g.stroke();g.beginPath();g.arc(450,270,90,0,7);g.stroke();g.strokeRect(310,25,280,145);g.strokeRect(355,25,190,75);g.strokeStyle='#f5df9e';g.lineWidth=8;g.beginPath();g.moveTo(410,65);g.lineTo(490,65);g.stroke();g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.ellipse(450,86,28,9,0,0,7);g.stroke();g.beginPath();g.arc(450,86,26,0,7);g.stroke();drawPerson(450,112,'#e34d47','AI',1.1);drawPerson(p.x,p.y,'#237de1','YOU',1.2);g.fillStyle='#f3a52d';g.beginPath();g.arc(ball.x,ball.y,11,0,7);g.fill();g.strokeStyle='#75451e';g.beginPath();g.moveTo(ball.x-10,ball.y);g.lineTo(ball.x+10,ball.y);g.moveTo(ball.x,ball.y-10);g.lineTo(ball.x,ball.y+10);g.stroke();g.fillStyle='white';g.font='bold 17px system-ui';g.fillText('BASKETBALL COURT',30,48)}function draw(){g.clearRect(0,0,900,540);mode.value==='kabaddi'?kabaddiCourt():basketballCourt();if(paused||!started){g.fillStyle='#06150caa';g.fillRect(0,0,900,540);g.fillStyle='white';g.textAlign='center';g.font='bold 34px system-ui';g.fillText(paused?'PAUSED':started?'':'PRESS START / TOSS',450,275);g.textAlign='left'}}function makeBots(){bots=Array.from({length:7},(_,i)=>({x:560+(i%3)*85,y:100+Math.floor(i/3)*155,out:false,id:i}))}function reset(){you=ai=0;p={x:170,y:270};phase='ready';turn=document.querySelector('#toss').value;paused=false;started=true;seconds=0;tags=0;makeBots();ball={x:450,y:300};score();msg.textContent='Toss complete. '+(turn==='you'?'You raid first.':'AI raids first.');if(mode.value==='kabaddi'&&turn==='ai')setTimeout(aiRaid,700);draw()}function aiRaid(){if(!started||paused||mode.value!=='kabaddi')return;phase='aiRaid';msg.textContent='AI raider enters! Move close and tackle with ACTION.';let x=735;let timer=setInterval(()=>{if(paused||!started){clearInterval(timer);return}x-=10;if(x<470){clearInterval(timer);if(Math.random()<.45){ai+=1;msg.textContent='AI escaped with a touch point.'}else{you+=1;msg.textContent='Successful tackle! You earn 1 point.'}turn='you';phase='ready';score();draw()}},45)}function finishRaid(safe){if(safe){you+=tags;bots.forEach(b=>{if(b.tagged){b.out=true;b.tagged=false}});msg.textContent='Safe return! '+tags+' touch points scored.'}else{ai+=1;msg.textContent='TACKLED / RAID OUT! AI earns 1 point.'}score();p={x:170,y:270};phase='ready';turn='ai';tags=0;seconds=0;setTimeout(aiRaid,850)}function action(){if(!started||paused)return;if(mode.value==='kabaddi'){if(phase==='ready'&&turn==='you'){phase='raid';seconds=0;tags=0;msg.textContent='Raid started! Cross midline and tap TAG near defenders.';return}if(phase==='raid'){let b=bots.find(b=>!b.out&&!b.tagged&&p.x>450&&Math.hypot(p.x-b.x,p.y-b.y)<58);if(b){b.tagged=true;tags++;msg.textContent='Tagged defender '+(b.id+1)+'! Return across the midline.'}else msg.textContent='Get close to a defender on the opponent half to tag.'}}else{if(Math.hypot(p.x-450,p.y-100)<250){you+=2;msg.textContent='SWISH! Basket +2 points.';ball={x:450,y:300};p={x:450,y:350}}else msg.textContent='Move closer to the basket, then shoot.';score()}draw()}function loop(){if(started&&!paused){let dx=(keys.right||keys.d||keys.arrowright?1:0)-(keys.left||keys.a||keys.arrowleft?1:0),dy=(keys.down||keys.s||keys.arrowdown?1:0)-(keys.up||keys.w||keys.arrowup?1:0);p.x=Math.max(45,Math.min(855,p.x+dx*3.1));p.y=Math.max(45,Math.min(495,p.y+dy*3.1));if(mode.value==='kabaddi'&&phase==='raid'){seconds+=1/60;if(p.x<450&&tags>0)finishRaid(true);else if(p.x>450&&bots.some(b=>!b.out&&!b.tagged&&Math.hypot(p.x-b.x,p.y-b.y)<29)){finishRaid(false)}else if(seconds>30)finishRaid(false)} }draw();requestAnimationFrame(loop)}mode.onchange=()=>{document.querySelector('#title').textContent=mode.value==='kabaddi'?'🤼 Kabaddi 2D':'🏀 Basketball 2D';document.querySelector('#act').textContent=mode.value==='kabaddi'?'TAG / RAID':'SHOOT';p={x:170,y:270};draw()};document.querySelector('#start').onclick=reset;document.querySelector('#reset').onclick=reset;document.querySelector('#act').onclick=action;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶ Resume':'Ⅱ Pause';draw()};document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[k]=false))});addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();action()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let q=new URLSearchParams(location.search);if(q.get('sport')==='basketball')mode.value='basketball';else mode.value='kabaddi';mode.dispatchEvent(new Event('change'));makeBots();draw();score();loop()})();</script></body></html>
