<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kabaddi & Basketball 2D</title><style>*{box-sizing:border-box}body{margin:0;background:#10271e;color:#fff;font:16px system-ui;padding:12px;display:grid;place-items:center;min-height:100vh}.box{width:min(920px,100%);background:#183b2b;padding:16px;border-radius:18px}a{color:#b5f3d0}canvas{width:100%;display:block;border-radius:12px;background:#27834d;touch-action:none}button,select{padding:11px 13px;border:0;border-radius:9px;font-weight:800;margin:4px;background:#d9f99d;color:#123}button:disabled{opacity:.45}#score{font-size:19px;font-weight:900}.controls{display:flex;flex-wrap:wrap;gap:3px}.hint{color:#cbe5d5}#setup{padding:10px;background:#244b38;border-radius:12px;margin:10px 0}label{font-weight:700;margin:4px}</style></head><body><main class="box"><a href="/games.html">← Games</a><h1 id="title">🤼 Kabaddi 2D</h1><div id="setup"><label>Game <select id="mode"><option value="kabaddi">Kabaddi 7 vs 7</option><option value="basketball">Basketball</option></select></label><label>First raid <select id="toss"><option value="you">You raid first</option><option value="ai">AI raids first</option></select></label><button id="start">Start match / toss</button></div><div id="score">YOU 0 — 0 AI</div><div id="info" class="hint">Win the toss, raid across the centre line, tag defenders and return safely.</div><canvas id="c" width="900" height="500"></canvas><div class="controls"><button data-k="up">▲</button><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button><button id="act">RAID / TAG</button><button id="pause">Pause</button><button id="reset">Restart</button></div><p class="hint" id="hint">Use arrows/WASD or touch controls. In Kabaddi, cross the centre line, tag defenders, then return to your half before the AI catches you.</p></main><script>(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),mode=document.querySelector('#mode'),keys={},scoreEl=document.querySelector('#score'),info=document.querySelector('#info'),hint=document.querySelector('#hint');let you=0,ai=0,phase='setup',paused=false,turn='you',raidTime=0,tagged=new Set(),p={x:170,y:250},bots=[],basket={x:450,y:70},ball={x:450,y:350};const names=['Corner L','In L','Cover L','Centre','Cover R','In R','Corner R'];function setup(){you=ai=0;phase='ready';paused=false;turn=document.querySelector('#toss').value;tagged.clear();p={x:170,y:250};bots=Array.from({length:7},(_,i)=>({x:570+(i%3)*55,y:100+Math.floor(i/3)*95,alive:true,id:i}));updateScore();info.textContent='Toss result: '+(turn==='you'?'You choose to raid first.':'AI chooses to raid first.');document.querySelector('#act').textContent=turn==='you'?'START RAID':'NEXT';if(turn==='ai')setTimeout(aiRaid,700);draw()}function updateScore(){scoreEl.textContent='YOU '+you+' — '+ai+' AI'}function draw(){g.clearRect(0,0,900,500);g.fillStyle=mode.value==='kabaddi'?'#267d4a':'#bd7845';g.fillRect(0,0,900,500);g.strokeStyle='#fff';g.lineWidth=4;g.strokeRect(25,25,850,450);g.beginPath();g.moveTo(450,25);g.lineTo(450,475);g.stroke();if(mode.value==='kabaddi'){g.setLineDash([9,8]);g.beginPath();g.moveTo(300,25);g.lineTo(300,475);g.moveTo(600,25);g.lineTo(600,475);g.stroke();g.setLineDash([]);g.fillStyle='#fff';g.font='bold 17px system-ui';g.fillText('YOUR HALF',100,55);g.fillText('AI HALF',690,55);g.fillText('BAULK LINE',315,495);bots.forEach(b=>{if(!b.alive)return;g.fillStyle='#e84b4b';g.beginPath();g.arc(b.x,b.y,17,0,7);g.fill();g.fillStyle='white';g.font='12px system-ui';g.fillText('D'+(b.id+1),b.x-10,b.y+4)});g.fillStyle='#2589ed';g.beginPath();g.arc(p.x,p.y,19,0,7);g.fill();g.fillStyle='white';g.font='bold 13px system-ui';g.fillText('YOU',p.x-15,p.y+4);g.fillStyle='#fff';g.font='bold 18px system-ui';g.fillText('Raid time: '+Math.max(0,30-Math.floor(raidTime/60))+'s',350,22)}else{g.beginPath();g.arc(450,250,90,0,7);g.stroke();g.strokeRect(330,25,240,95);g.strokeRect(370,25,160,45);g.fillStyle='#fff';g.beginPath();g.arc(ball.x,ball.y,11,0,7);g.fill();g.fillStyle='#e84b4b';g.fillRect(basket.x-25,70,50,12);g.fillStyle='#2589ed';g.beginPath();g.arc(p.x,p.y,19,0,7);g.fill()} }function finishRaid(success,n=0){if(success){you+=n;bots.filter(b=>tagged.has(b.id)).forEach(b=>b.alive=false);info.textContent='Safe return! '+n+' touch point(s).'}else{ai++;info.textContent='TACKLED! AI gets 1 point; your raider is out.'}updateScore();tagged.clear();phase='ready';turn='ai';p={x:170,y:250};if(bots.every(b=>!b.alive)){ai+=2;bots.forEach(b=>b.alive=true);info.textContent+=' ALL OUT! AI +2; defenders revived.'}setTimeout(aiRaid,900);draw()}function aiRaid(){if(mode.value!=='kabaddi'||phase==='ended')return;phase='ai';let target=bots.find(b=>b.alive);if(!target){bots.forEach(b=>b.alive=true);target=bots[0]}info.textContent='AI is raiding! Move near the centre and stop the raider.';let x=730,steps=0;const timer=setInterval(()=>{if(paused){return}steps++;x-=8;if(steps===15){const alive=7;const touched=Math.random()<.45?1:0;if(touched){you=Math.max(0,you);info.textContent='AI tagged a defender! Stop it from crossing back.'}}if(x<465){clearInterval(timer);if(Math.random()<.52){ai++;info.textContent='AI escaped with a touch point.'}else{you++;info.textContent='Great tackle! You score 1 tackle point.'}updateScore();turn='you';phase='ready';p={x:170,y:250};draw()}},45)}function startRaid(){if(mode.value!=='kabaddi'){return}if(phase!=='ready'||turn!=='you')return;phase='raid';raidTime=0;tagged.clear();info.textContent='Your raid! Cross the midline, tag defenders, and get back.';document.querySelector('#act').textContent='TAG NEARBY';}function action(){if(mode.value==='basketball'){if(Math.hypot(p.x-450,p.y-85)<190){you+=2;info.textContent='Basket! +2'}else info.textContent='Move closer to the hoop.';updateScore();draw();return}if(phase==='ready'){startRaid();return}if(phase!=='raid')return;const b=bots.find(b=>b.alive&&!tagged.has(b.id)&&Math.hypot(p.x-b.x,p.y-b.y)<55);if(b){tagged.add(b.id);info.textContent='Tagged defender '+(b.id+1)+'! Now return across the centre line.'}else info.textContent='No defender close enough to tag.';draw()}function loop(){if(!paused){let dx=(keys.right||keys.d||keys.arrowright?1:0)-(keys.left||keys.a||keys.arrowleft?1:0),dy=(keys.down||keys.s||keys.arrowdown?1:0)-(keys.up||keys.w||keys.arrowup?1:0);p.x=Math.max(40,Math.min(860,p.x+dx*3));p.y=Math.max(45,Math.min(455,p.y+dy*3));if(phase==='raid'){raidTime++;if(p.x>450&&bots.some(b=>b.alive&&Math.hypot(p.x-b.x,p.y-b.y)<30)){finishRaid(false)}else if(p.x<450&&tagged.size){finishRaid(true,tagged.size)}else if(raidTime>1800)finishRaid(false)}if(mode.value==='basketball'){p.x=Math.max(35,Math.min(865,p.x));p.y=Math.max(35,Math.min(465,p.y))}}draw();requestAnimationFrame(loop)}mode.onchange=()=>{document.querySelector('#title').textContent=mode.value==='kabaddi'?'🤼 Kabaddi 2D':'🏀 Basketball 2D';document.querySelector('#act').textContent=mode.value==='kabaddi'?'RAID / TAG':'SHOOT';phase='ready';p={x:170,y:250};draw()};document.querySelector('#start').onclick=setup;document.querySelector('#act').onclick=action;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Resume':'Pause'};document.querySelector('#reset').onclick=setup;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')action()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[k]=false))});const q=new URLSearchParams(location.search);if(q.get('sport')==='kabaddi')mode.value='kabaddi';else if(q.get('sport')==='basketball')mode.value='basketball';mode.dispatchEvent(new Event('change'));setup();loop()})();</script></body></html>
