<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071b16">
<meta name="description" content="Play VETER World Mini Football, a free browser penalty challenge.">
<title>VETER World — Mini Football</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#163c2c,#071b16 65%);color:#fff;font-family:system-ui,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}.game{width:min(100%,820px);background:#102820;border:1px solid #315b49;border-radius:20px;padding:16px;box-shadow:0 18px 55px #0008}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}h1{font-size:clamp(20px,4vw,30px);margin:0}small{color:#b8d9c9}.back{color:#b8d9c9;text-decoration:none;font-size:13px}.back:hover{color:#fff}.score{font-weight:800;background:#071b16;padding:9px 13px;border-radius:12px}canvas{width:100%;display:block;border-radius:14px;background:#27834d;touch-action:manipulation}.hint{text-align:center;color:#c9e5d7;font-size:13px;margin:12px 0}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:9px}button{border:0;border-radius:13px;padding:14px 8px;font-size:15px;font-weight:800;color:#092016;background:#d9f99d;touch-action:manipulation;cursor:pointer}button:active{transform:scale(.97)}#shoot{background:#ffcf5a}#restart{background:#b8d8ff;margin-top:10px;width:100%}.status{text-align:center;min-height:26px;font-weight:700;color:#ffedb0;margin-top:10px}@media(max-width:420px){.game{padding:10px}.controls{gap:6px}button{font-size:13px;padding:13px 5px}}
</style>
</head>
<body>
<main class="game">
<header><div><a class="back" href="products.html">← Back to VETER Games</a><h1>⚽ VETER WORLD</h1><small>Mini Football · Penalty Challenge</small></div><div class="score">Goals: <span id="goals">0</span> / 5</div></header>
<canvas id="field" width="720" height="480" aria-label="Football penalty game"></canvas>
<div class="hint">Aim left or right, then shoot. Score as many goals as you can in 5 shots!</div>
<div class="controls"><button id="left" type="button">◀ Aim left</button><button id="right" type="button">Aim right ▶</button><button id="shoot" type="button">⚽ SHOOT</button></div>
<div class="status" id="status" aria-live="polite">Ready? Take your first shot!</div><button id="restart" type="button">↻ Play again</button>
</main>
<script>
const c=document.getElementById('field'),ctx=c.getContext('2d');
const goalsEl=document.getElementById('goals'),statusEl=document.getElementById('status');
let goals=0,shots=0,aim=0,keeperX=360,ball={x:360,y:390,r:12},locked=false,keeperTarget=360;
function draw(){const w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#27834d';ctx.fillRect(0,0,w,h);for(let i=0;i<8;i++){ctx.fillStyle=i%2?'#2b8b50':'#258049';ctx.fillRect(i*w/8,0,w/8,h)}ctx.strokeStyle='#d9f5df';ctx.lineWidth=4;ctx.strokeRect(28,22,w-56,h-44);ctx.beginPath();ctx.moveTo(28,300);ctx.lineTo(w-28,300);ctx.stroke();ctx.beginPath();ctx.arc(360,300,65,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#e8f4ed';ctx.fillRect(235,35,250,18);ctx.fillRect(235,35,8,85);ctx.fillRect(477,35,8,85);ctx.strokeStyle='#c7ded1';ctx.lineWidth=2;for(let x=250;x<480;x+=20){ctx.beginPath();ctx.moveTo(x,54);ctx.lineTo(x,118);ctx.stroke()}for(let y=65;y<120;y+=18){ctx.beginPath();ctx.moveTo(238,y);ctx.lineTo(482,y);ctx.stroke()}ctx.fillStyle='#ffcf5a';ctx.fillRect(keeperX-28,76,56,34);ctx.fillStyle='#172b23';ctx.beginPath();ctx.arc(keeperX,66,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#173fbd';ctx.beginPath();ctx.arc(360,424,19,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.fillRect(350,438,20,25);if(!locked){ctx.strokeStyle='#fff9a8';ctx.setLineDash([8,8]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(360,390);ctx.lineTo(360+aim*125,120);ctx.stroke();ctx.setLineDash([])}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#15241c';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#15241c';ctx.beginPath();ctx.arc(ball.x,ball.y,4,0,Math.PI*2);ctx.fill()}
function setAim(v){if(locked||shots>=5)return;aim=Math.max(-1,Math.min(1,aim+v));draw()}
function shoot(){if(locked||shots>=5)return;locked=true;shots++;keeperTarget=180+Math.random()*360;const targetX=360+aim*170,saved=Math.abs(targetX-keeperTarget)<48,start={x:ball.x,y:ball.y};let t=0;function frame(){t+=.035;const p=Math.min(t,1);ball.x=start.x+(targetX-start.x)*p;ball.y=start.y+( (saved?112:75)-start.y)*p-45*Math.sin(Math.PI*p);keeperX+=(keeperTarget-keeperX)*.13;draw();if(p<1)requestAnimationFrame(frame);else setTimeout(()=>{if(saved)statusEl.textContent='🧤 Saved! The keeper got it.';else{goals++;goalsEl.textContent=goals;statusEl.textContent='🎉 GOOOAL! Great shot!'}ball={x:360,y:390,r:12};aim=0;locked=false;if(shots>=5)statusEl.textContent+=' Final score: '+goals+' goal'+(goals===1?'':'s')+' out of 5.';draw()},350)}requestAnimationFrame(frame)}
document.getElementById('left').onclick=()=>setAim(-.35);document.getElementById('right').onclick=()=>setAim(.35);document.getElementById('shoot').onclick=shoot;
document.getElementById('restart').onclick=()=>{goals=0;shots=0;aim=0;keeperX=360;ball={x:360,y:390,r:12};locked=false;goalsEl.textContent='0';statusEl.textContent='Ready? Take your first shot!';draw()};
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')setAim(-.2);if(e.key==='ArrowRight')setAim(.2);if(e.key===' '||e.key==='Enter'){e.preventDefault();shoot()}});draw();
</script>
</body>
</html>
