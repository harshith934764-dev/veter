<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071b16">
<meta name="description" content="Play VETER World Mini Football, a free browser penalty challenge.">
<title>VETER World — Mini Football</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#163c2c,#071b16 65%);color:#fff;font-family:system-ui,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}.game{width:min(100%,820px);background:#102820;border:1px solid #315b49;border-radius:20px;padding:16px;box-shadow:0 18px 55px #0008}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}h1{font-size:clamp(20px,4vw,30px);margin:0}small{color:#b8d9c9}.back{color:#b8d9c9;text-decoration:none;font-size:13px}.back:hover{color:#fff}.score{font-weight:800;background:#071b16;padding:9px 13px;border-radius:12px}canvas{width:100%;display:block;border-radius:14px;background:#27834d;touch-action:manipulation}.hint{text-align:center;color:#c9e5d7;font-size:13px;margin:12px 0}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:9px}button{border:0;border-radius:13px;padding:14px 8px;font-size:15px;font-weight:800;color:#092016;background:#d9f99d;touch-action:manipulation;cursor:pointer}button:active{transform:scale(.97)}#shoot{background:#ffcf5a}#restart{background:#b8d8ff;margin-top:10px;width:100%}.status{text-align:center;min-height:26px;font-weight:700;color:#ffedb0;margin-top:10px}@media(max-width:420px){.game{padding:10px}.controls{gap:6px}button{font-size:13px;padding:13px 5px}}
</style>
  <script src="/veter-loader.js?v=1" defer></script>
</head>
<body>
<main class="game">
<header><div><a class="back" href="products.html">← Back to VETER Games</a><h1>⚽ VETER WORLD</h1><small>Mini Football · Penalty Challenge</small></div><div class="score">Goals: <span id="goals">0</span> / 5</div></header>
<canvas id="field" width="720" height="480" aria-label="Football penalty game"></canvas>
<div class="hint">Aim left or right, then shoot. Score as many goals as you can in 5 shots!</div>
<div class="controls"><button id="left" type="button">◀ Aim left</button><button id="right" type="button">Aim right ▶</button><button id="shoot" type="button">⚽ SHOOT</button></div>
<div class="status" id="status" aria-live="polite">Ready? Take your first shot!</div><button id="restart" type="button">↻ Play again</button>
</main>
<script src="assets/js/veter-world-football.js" defer></script>
</body>
</html>
