<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Football Penalty Shootout 2D</title><style>*{box-sizing:border-box}body{margin:0;background:#071b16;color:#fff;font:15px system-ui;display:grid;place-items:center;min-height:100vh;padding:12px}.box{width:min(900px,100%);background:#102820;border:1px solid #315b49;border-radius:18px;padding:14px}a{color:#b8e9d3}canvas{width:100%;display:block;border-radius:12px;background:#27834d;margin-top:12px;touch-action:none}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,select{border:0;border-radius:10px;padding:12px 16px;font-weight:900;background:#d9f99d;color:#092016;touch-action:manipulation}.hint{color:#c9e5d7;font-size:13px}</style></head><body><main class="box"><a href="/games.html">← Games</a><h1>⚽ Football Penalty Shootout 2D</h1><p class="hint">Play 1 vs AI or take turns with a friend on the same device.</p><label>Match <select id="mode"><option value="ai">1 vs 1 — You vs AI</option><option value="local">1 vs 1 — Local multiplayer</option></select></label> <button id="start">Start shootout</button><h2 id="score">YOU 0 — 0 AI</h2><canvas id="field" width="800" height="460"></canvas><div class="row"><button id="left">AIM LEFT</button><button id="center">AIM CENTRE</button><button id="right">AIM RIGHT</button><button id="kick">KICK / SAVE</button><button id="reset">Restart</button></div><p class="hint" id="status">Five shots each. Aim left, centre or right. When defending, choose where to dive.</p></main><script>(()=>{const c=document.querySelector('#field'),g=c.getContext('2d'),mode=document.querySelector('#mode'),scoreEl=document.querySelector('#score'),status=document.querySelector('#status');let you=0,opp=0,shot=0,turn='you',aim='centre',started=false,keeper='centre',message='Ready for kick-off';function draw(){g.fillStyle='#287d49';g.fillRect(0,0,800,460);for(let i=0;i<8;i++){g.fillStyle=i%2?'#2b854d':'#267644';g.fillRect(i*100,0,100,460)}g.strokeStyle='white';g.lineWidth=4;g.strokeRect(70,25,660,410);g.fillStyle='#fff';g.fillRect(290,35,220,18);g.strokeRect(290,35,220,100);g.fillStyle='#e2f2ff';g.fillRect(370,70,60,48);g.fillStyle='#f2bd8e';g.beginPath();g.arc(400,60,15,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(400,365,11,0,7);g.fill();g.fillStyle='#f9d34b';g.beginPath();g.arc(400,420,17,0,7);g.fill();g.fillStyle='#fff';g.font='bold 20px system-ui';g.fillText('PENALTY SHOOTOUT',24,25);g.fillText('Shot '+Math.min(shot+1,5)+'/5 · '+(turn==='you'?'Your turn':'Opponent turn'),24,445);g.fillStyle='#fff';g.font='bold 15px system-ui';g.fillText('Aim: '+aim.toUpperCase(),610,445)}function update(){scoreEl.textContent='YOU '+you+' — '+opp+' '+(mode.value==='ai'?'AI':'PLAYER 2');draw()}function kick(){if(!started){status.textContent='Press Start shootout first.';return}let scoring;if(turn==='you'){scoring=aim!==keeper; if(scoring)you++;}else{if(mode.value==='local'){scoring=aim!==keeper;if(scoring)opp++;}else{const aiAim=['left','centre','right'][Math.floor(Math.random()*3)];scoring=aiAim!==keeper;if(scoring)opp++;message='AI aimed '+aiAim+'.';}}status.textContent=(scoring?'GOAL!':'SAVED!')+' '+(turn==='you'?'Your':'Opponent')+' shot.';shot++;if(mode.value==='local')turn=turn==='you'?'opp':'you';else turn='you';if(shot>=10){started=false;status.textContent+=' Shootout finished — '+(you>opp?'You win!':you<opp?'AI wins!':'Draw!');}else if(mode.value==='ai'&&shot%2===1){turn='opp';status.textContent+=' AI is taking its shot next.';}else turn='you';update()}function setAim(v){aim=v;if(turn==='opp'&&mode.value==='ai'){keeper=v;status.textContent='Choose where to dive, then tap KICK / SAVE.'}else status.textContent='Aim set to '+v+'. Tap KICK.';draw()}document.querySelector('#left').onclick=()=>setAim('left');document.querySelector('#center').onclick=()=>setAim('centre');document.querySelector('#right').onclick=()=>setAim('right');document.querySelector('#kick').onclick=()=>{if(turn==='opp'&&mode.value==='ai'){const aiAim=['left','centre','right'][Math.floor(Math.random()*3)];const scored=aiAim!==aim;if(scored)opp++;shot++;turn='you';status.textContent='AI shot '+aiAim+' — '+(scored?'GOAL':'SAVED!');if(shot>=10){started=false;status.textContent+=' Match over!';}update()}else{keeper=mode.value==='ai'?['left','centre','right'][Math.floor(Math.random()*3)]:aim;kick()}};document.querySelector('#start').onclick=()=>{you=opp=shot=0;turn='you';started=true;aim='centre';status.textContent='You shoot first!';update()};document.querySelector('#reset').onclick=()=>document.querySelector('#start').click();update()})();</script></main></body></html>
