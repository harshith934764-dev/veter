<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>VETER 2D Football</title><style>*{box-sizing:border-box}body{margin:0;background:#071b16;color:white;font:15px system-ui;display:grid;place-items:center;min-height:100vh;padding:12px}.box{width:min(900px,100%);background:#102820;border:1px solid #315b49;border-radius:18px;padding:14px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}a{color:#b8e9d3}canvas{width:100%;display:block;border-radius:12px;background:#27834d;margin-top:12px;touch-action:none}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:12px 16px;font-weight:900;background:#d9f99d;color:#092016;touch-action:manipulation}.hint{color:#c9e5d7;font-size:13px}</style></head><body><main class="box"><header><div><a href="/games.html">← VETER Games</a><h1>⚽ VETER 2D Football</h1><div class="hint">Move your player and tap SHOOT to score past the keeper.</div></div><b id="score">Goals: 0</b></header><canvas id="field" width="800" height="460"></canvas><div class="row"><button data-m="up">▲</button><button data-m="left">◀</button><button data-m="down">▼</button><button data-m="right">▶</button><button id="shoot">⚽ SHOOT</button><button id="reset">Restart</button></div><p class="hint" id="status">Use arrows/WASD or the buttons. Get close to the ball and shoot!</p></main><script>(()=>{const c=document.getElementById('field'),g=c.getContext('2d'),keys={},p={x:400,y:340},b={x:400,y:260},keeper={x:400},score=0,goal=0;let message='Kick off!';function draw(){g.clearRect(0,0,800,460);g.fillStyle='#287d49';g.fillRect(0,0,800,460);for(let i=0;i<8;i++){g.fillStyle=i%2?'#2b854d':'#267644';g.fillRect(i*100,0,100,460)}g.strokeStyle='#eaffed';g.lineWidth=4;g.strokeRect(70,25,660,410);g.beginPath();g.moveTo(70,230);g.lineTo(730,230);g.stroke();g.beginPath();g.arc(400,230,65,0,7);g.stroke();g.strokeRect(260,25,280,95);g.strokeRect(330,25,140,45);g.fillStyle='#fff';g.fillRect(330,8,140,17);g.fillStyle='#e2f2ff';g.fillRect(keeper.x-24,55,48,55);g.fillStyle='#f2bd8e';g.beginPath();g.arc(keeper.x,45,15,0,7);g.fill();g.fillStyle='#f8f8f8';g.beginPath();g.arc(b.x,b.y,12,0,7);g.fill();g.strokeStyle='#222';g.lineWidth=2;g.beginPath();g.moveTo(b.x-9,b.y);g.lineTo(b.x+9,b.y);g.stroke();g.fillStyle='#2771c9';g.beginPath();g.arc(p.x,p.y,20,0,7);g.fill();g.fillStyle='white';g.font='bold 18px system-ui';g.fillText('VETER',p.x-29,p.y+6);g.fillStyle='#fff';g.font='bold 18px system-ui';g.fillText('GOALS '+score,20,30)}function tick(){let dx=0,dy=0;if(keys.up||keys.w||keys.ArrowUp)dy--;if(keys.down||keys.s||keys.ArrowDown)dy++;if(keys.left||keys.a||keys.ArrowLeft)dx--;if(keys.right||keys.d||keys.ArrowRight)dx++;p.x=Math.max(95,Math.min(705,p.x+dx*3));p.y=Math.max(145,Math.min(410,p.y+dy*3));keeper.x+=Math.sign(b.x-keeper.x)*1.4;draw();requestAnimationFrame(tick)}function shoot(){if(Math.hypot(p.x-b.x,p.y-b.y)>85){message='Move closer to the ball first!';}else{const target=350+Math.random()*100;if(Math.abs(target-keeper.x)>30){score++;message='GOAL! Nice shot!';}else message='Keeper saved it! Try again.';b.x=400;b.y=260;p.x=400;p.y=340;document.getElementById('score').textContent='Goals: '+score;}document.getElementById('status').textContent=message}window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-m]').forEach(el=>{const k=el.dataset.m;el.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>keys[k]=false))});document.getElementById('shoot').onclick=shoot;document.getElementById('reset').onclick=()=>{score=0;p.x=400;p.y=340;b.x=400;b.y=260;document.getElementById('score').textContent='Goals: 0';document.getElementById('status').textContent='New match!'};tick()})();</script></body></html>
