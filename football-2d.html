<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Football 2D</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#071a13;color:white;font:15px system-ui;display:grid;place-items:center;min-height:100vh}.game{width:min(980px,100%);background:#102b20;border:1px solid #28533d;border-radius:18px;padding:12px}a{color:#b8f2d2}canvas{width:100%;height:auto;display:block;margin-top:10px;border-radius:14px;touch-action:none}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.score{font-size:22px;font-weight:900}.panel{background:#17412e;border-radius:13px;padding:12px;margin-top:10px}.row{display:flex;gap:8px;flex-wrap:wrap}button,select{border:0;border-radius:10px;padding:12px 15px;background:#d9fa91;color:#142c1c;font-weight:900}#kick{background:#ffc65c;flex:1;font-size:18px}#msg{color:#d7eddf;min-height:24px;margin:8px 0 0}.small{color:#b8d5c3;font-size:13px}</style></head><body><main class="game"><a href="/games.html">← Games</a><div class="top"><h1>⚽ Football 2D</h1><div class="score" id="score">YOU 0 — 0 AI</div></div><div class="panel row"><label>Mode <select id="mode"><option value="ai">1 vs AI</option><option value="local">2 players · same device</option></select></label><button id="start">START MATCH</button></div><canvas id="c" width="900" height="540"></canvas><div class="panel"><div class="row"><button data-dir="left">◀ LEFT</button><button data-dir="centre">● CENTRE</button><button data-dir="right">RIGHT ▶</button><button id="kick">⚽ SHOOT / SAVE</button><button id="pause">Ⅱ Pause</button><button id="reset">↻ Restart</button></div><p id="msg">Start a penalty shootout. Choose a corner and shoot. Defend by choosing where to dive.</p><div class="small">Five kicks each, alternating. If level after five each, sudden death. Keyboard: ← → to aim, Space to shoot.</div></div></main><script>(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),mode=document.querySelector('#mode'),msg=document.querySelector('#msg'),score=document.querySelector('#score');let a=0,b=0,kicks=0,turn=0,phase='shoot',aim='centre',started=false,paused=false,done=false,ballX=450,ballY=400,flight=0,keeper=450;const dirs={left:335,centre:450,right:565};function drawPerson(x,y,shirt,scale=1,dive=0){g.save();g.translate(x,y);g.scale(scale,scale);g.fillStyle='#0004';g.beginPath();g.ellipse(0,13,19,7,0,0,7);g.fill();g.strokeStyle='#f2c49b';g.lineWidth=8;g.lineCap='round';g.beginPath();g.moveTo(-7,0);g.lineTo(-12,17);g.moveTo(7,0);g.lineTo(12,17);g.stroke();g.fillStyle=shirt;g.beginPath();g.roundRect(-13,-23,26,28,7);g.fill();g.fillStyle='#f0c49b';g.beginPath();g.arc(0,-31,10,0,7);g.fill();g.strokeStyle='#f0c49b';g.lineWidth=7;g.beginPath();g.moveTo(-11,-17);g.lineTo(dive?-25:-20,dive?-24:-2);g.moveTo(11,-17);g.lineTo(dive?25:20,dive?-24:-2);g.stroke();g.restore()}function field(){g.fillStyle='#247d43';g.fillRect(0,0,900,540);for(let i=0;i<9;i++){g.fillStyle=i%2?'#2c894c':'#237840';g.fillRect(i*100,0,100,540)}g.strokeStyle='#fff';g.lineWidth=3;g.strokeRect(35,22,830,496);g.beginPath();g.moveTo(35,270);g.lineTo(865,270);g.stroke();g.beginPath();g.arc(450,270,75,0,7);g.stroke();g.strokeRect(245,22,410,150);g.strokeRect(320,22,260,75);g.strokeRect(335,22,230,9);for(let x=335;x<=565;x+=115){g.beginPath();g.moveTo(x,22);g.lineTo(x,75);g.stroke()}g.fillStyle='#fff';g.font='bold 16px system-ui';g.fillText('GOAL',422,18);g.fillText('PENALTY SPOT',390,215);g.fillStyle='#dcebdc';g.fillRect(400,70,100,8);drawPerson(keeper,120,'#f4bd35',1.25,flight>0);drawPerson(450,390,turn===0?'#2587ed':'#ef6655',1.3);g.fillStyle='#fff';g.beginPath();g.arc(ballX,ballY,flight?Math.max(5,12-flight*.12):12,0,7);g.fill();g.strokeStyle='#222';g.lineWidth=2;g.beginPath();g.arc(ballX,ballY,5,0,7);g.stroke();g.fillStyle='#fff';g.font='bold 17px system-ui';g.fillText('SHOT '+(Math.floor(kicks/2)+1),25,35);g.fillText('AIM: '+aim.toUpperCase(),25,60);if(paused||done){g.fillStyle='#04150dcc';g.fillRect(0,0,900,540);g.fillStyle='white';g.textAlign='center';g.font='bold 38px system-ui';g.fillText(paused?'PAUSED':'MATCH COMPLETE',450,260);g.textAlign='left'}}function update(){score.textContent='YOU '+a+' — '+b+' '+(mode.value==='ai'?'AI':'PLAYER 2');draw()}function finish(goal){if(goal){if(turn===0)a++;else b++}kicks++;msg.textContent=goal?'GOAL!':'SAVED! / WIDE!';if(kicks>=10&&a!==b){done=true;msg.textContent+=' Shootout finished.'}else if(kicks>=10&&a===b){msg.textContent+=' Sudden death: continue one kick each.'}turn=1-turn;phase='shoot';ballX=450;ballY=400;flight=0;keeper=450;if(mode.value==='ai'&&turn===1)setTimeout(ai,700);update()}function shot(){if(!started||done||paused)return;if(phase==='defend'){let save=aim===lastShot;finish(!save);return}let lastShot=aim;const keeperChoice=mode.value==='ai'?['left','centre','right'][Math.floor(Math.random()*3)]:aim;let goal=aim!==keeperChoice;flight=1;ballX=dirs[aim];ballY=105;keeper=dirs[keeperChoice];draw();setTimeout(()=>finish(goal),450)}let lastShot='centre';function ai(){if(done||paused)return;phase='defend';msg.textContent='AI is taking the shot! Choose a dive direction and press SHOOT / SAVE.';update()}document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{aim=b.dataset.dir;update()});document.querySelector('#kick').onclick=shot;document.querySelector('#start').onclick=()=>{a=b=kicks=0;turn=0;phase='shoot';started=true;done=paused=false;aim='centre';msg.textContent='Player 1: choose your shot direction.';update()};document.querySelector('#reset').onclick=()=>document.querySelector('#start').click();document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶ Resume':'Ⅱ Pause';update()};addEventListener('keydown',e=>{if(e.key==='ArrowLeft')aim='left';if(e.key==='ArrowRight')aim='right';if(e.code==='Space'){e.preventDefault();shot()}update()});update()})();</script></body></html>
