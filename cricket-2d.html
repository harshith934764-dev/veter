<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>VETER Cricket 2D</title><style>*{box-sizing:border-box}body{margin:0;background:#071b16;color:#fff;font:15px system-ui;display:grid;place-items:center;min-height:100vh;padding:12px}.box{width:min(900px,100%);background:#102b20;border:1px solid #315b49;border-radius:18px;padding:14px}header{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}a{color:#a9eed0}h1{margin:4px 0}canvas{width:100%;display:block;border-radius:12px;background:#277d48;touch-action:manipulation;margin-top:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:12px 18px;font-weight:900;background:#d9f99d;color:#142c1e;cursor:pointer;touch-action:manipulation}.score{font-weight:900;font-size:18px}.hint{color:#c2ddce;font-size:13px}</style></head><body><main class="box"><header><div><a href="/games.html">← VETER Games</a><h1>🏏 VETER Cricket 2D</h1><div class="hint">Tap HIT when the ball reaches the batting zone. Score as many runs as you can in 12 balls!</div></div><div class="score" id="score">0 / 0 · 12 balls</div></header><canvas id="c" width="800" height="440"></canvas><div class="row"><button id="hit">🏏 HIT</button><button id="start">START / RESTART</button></div><p class="hint" id="msg">Press START, then time your shot!</p></main><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),score=document.getElementById('score'),msg=document.getElementById('msg');let runs=0,wickets=0,balls=0,active=false,ball={x:700,y:220,v:0},bat=0,flash=0;function draw(){x.clearRect(0,0,800,440);x.fillStyle='#277d48';x.fillRect(0,0,800,440);x.fillStyle='#c6a16c';x.fillRect(250,55,300,330);x.fillStyle='#e7c99a';x.fillRect(300,65,200,310);x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(300,65,200,310);for(let i=0;i<3;i++){x.fillStyle='#f6e7c8';x.fillRect(265+i*8,196,4,48);x.fillRect(525+i*8,196,4,48)}x.fillStyle='#e4f4e8';x.font='bold 20px system-ui';x.fillText('VETER CRICKET',24,35);x.fillStyle='#173d2c';x.fillRect(100,190,34,60);x.fillStyle='#f1c38c';x.beginPath();x.arc(117,178,13,0,7);x.fill();x.strokeStyle='#f3d6a1';x.lineWidth=9;x.beginPath();x.moveTo(125,205);x.lineTo(170,bat?170:225);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,10,0,7);x.fill();x.fillStyle='#fff';x.font='16px system-ui';x.fillText('Runs '+runs+'   Wickets '+wickets+'   Balls '+balls+'/12',24,420);if(flash){x.fillStyle='#fff';x.font='bold 36px system-ui';x.fillText(flash>1?'SIX!':'SHOT!',340,100)}}function update(){if(active){ball.x-=ball.v;ball.y+=Math.sin((700-ball.x)/45)*1.2;if(ball.x<160){active=false;balls++;if(Math.abs(ball.y-220)<45){const r=Math.random();runs+=r>.82?6:r>.56?4:r>.25?2:1;msg.textContent='Great timing! '+(r>.82?'SIX!':r>.56?'FOUR!':'Runs scored!')}else{wickets++;msg.textContent='Bowled! Try the next ball.'}if(balls>=12||wickets>=3)msg.textContent+=' Innings over — final score '+runs+'/'+wickets+'. Press restart.';else setTimeout(()=>{if(balls<12&&wickets<3){ball={x:700,y:180+Math.random()*80,v:0};draw()}},550);score.textContent=runs+' / '+wickets+' · '+(12-balls)+' balls';} }if(flash>0)flash-=.12;draw();requestAnimationFrame(update)}function hit(){if(!active&&balls<12&&wickets<3){if(ball.v===0&&ball.x>500){msg.textContent='Wait for the ball to reach the batter!';return}return}if(active){const timing=Math.abs(ball.x-165);if(timing<65){ball.v=0;active=false;balls++;const r=timing<18?6:timing<35?4:timing<52?2:1;runs+=r;flash=r>=4?2:1;msg.textContent=r===6?'SIX! What a shot!':r===4?'FOUR! Beautiful boundary!':r+' run(s)!';}else if(ball.x<235){active=false;balls++;wickets++;msg.textContent='Missed it — wicket!';}score.textContent=runs+' / '+wickets+' · '+(12-balls)+' balls';if(balls>=12||wickets>=3)msg.textContent+=' Innings complete!';}}document.getElementById('hit').onclick=hit;function start(){runs=0;wickets=0;balls=0;active=false;ball={x:700,y:210,v:0};score.textContent='0 / 0 · 12 balls';msg.textContent='Ball incoming!';function bowl(){if(balls>=12||wickets>=3)return;ball={x:700,y:190+Math.random()*60,v:4.3};active=true;}bowl();const old=hit;document.getElementById('hit').onclick=()=>{if(active){const timing=Math.abs(ball.x-165);if(timing<62){const r=timing<17?6:timing<34?4:timing<50?2:1;runs+=r;balls++;active=false;flash=r>=4?2:1;msg.textContent=r===6?'SIX!':r===4?'FOUR!':r+' runs';}else if(ball.x<230){balls++;wickets++;active=false;msg.textContent='WICKET!';}score.textContent=runs+' / '+wickets+' · '+(12-balls)+' balls';if(balls<12&&wickets<3)setTimeout(bowl,850);else msg.textContent+=' Innings over!';}};}document.getElementById('start').onclick=start;update();})();</script></body></html>
