<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cricket 2D — Batting Challenge</title><style>*{box-sizing:border-box}body{margin:0;background:#071b16;color:#fff;font:15px system-ui;display:grid;place-items:center;min-height:100vh;padding:12px}.box{width:min(900px,100%);background:#102b20;border:1px solid #315b49;border-radius:18px;padding:14px}header{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}a{color:#a9eed0}canvas{width:100%;display:block;border-radius:12px;background:#277d48;touch-action:manipulation;margin-top:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}button,select{border:0;border-radius:10px;padding:12px 16px;font-weight:900;background:#d9f99d;color:#142c1e}.score{font-weight:900;font-size:18px}.hint{color:#c2ddce;font-size:13px}#menu{background:#1a4933;padding:12px;border-radius:12px;margin-top:12px}label{margin-right:12px}</style></head><body><main class="box"><header><div><a href="/games.html">← Games</a><h1>🏏 Cricket 2D — Batting</h1><div class="hint">Choose overs, chase the target and protect your wickets.</div></div><div class="score" id="score">0/0 · 0.0 overs</div></header><section id="menu"><label>Overs <select id="overs"><option value="1">1 over</option><option value="2">2 overs</option><option value="5" selected>5 overs</option><option value="10">10 overs</option><option value="20">20 overs</option></select></label><label>Target <select id="target"><option value="0">No target (set a score)</option><option value="20">20 runs</option><option value="30">30 runs</option><option value="50">50 runs</option><option value="75">75 runs</option></select></label><button id="start">Start innings</button></section><canvas id="c" width="800" height="440"></canvas><div class="row"><button id="hit">🏏 HIT</button><button id="pause">Pause</button><button id="restart">Restart</button></div><p class="hint" id="msg">Choose your overs and target, then start. You have 6 balls per over and 10 wickets.</p></main><script>(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),score=document.querySelector('#score'),msg=document.querySelector('#msg'),menu=document.querySelector('#menu');let runs=0,wickets=0,balls=0,maxBalls=30,target=0,active=false,paused=false,ball={x:700,y:210,v:0},done=true,batting=true;function draw(){x.clearRect(0,0,800,440);x.fillStyle='#277d48';x.fillRect(0,0,800,440);x.fillStyle='#c6a16c';x.fillRect(250,55,300,330);x.fillStyle='#e7c99a';x.fillRect(300,65,200,310);x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(300,65,200,310);for(let i=0;i<3;i++){x.fillStyle='#f6e7c8';x.fillRect(265+i*8,196,4,48);x.fillRect(525+i*8,196,4,48)}x.fillStyle='#e4f4e8';x.font='bold 20px system-ui';x.fillText('CRICKET BATTING CHALLENGE',24,35);x.fillStyle='#173d2c';x.fillRect(100,190,34,60);x.fillStyle='#f1c38c';x.beginPath();x.arc(117,178,13,0,7);x.fill();x.strokeStyle='#f3d6a1';x.lineWidth=9;x.beginPath();x.moveTo(125,205);x.lineTo(170,batting?220:225);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,10,0,7);x.fill();x.fillStyle='#fff';x.font='16px system-ui';x.fillText('Runs '+runs+'   Wickets '+wickets+'   Balls '+balls+'/'+maxBalls,24,420);if(target)x.fillText('TARGET '+target,620,35)}function updateScore(){score.textContent=runs+'/'+wickets+' · '+Math.floor(balls/6)+'.'+balls%6+' overs'}function endBall(result){active=false;balls++;if(result==='wicket'){wickets++;msg.textContent='WICKET! Your innings continues if wickets remain.'}else{runs+=result;msg.textContent=result===6?'SIX! Maximum!':result===4?'FOUR! Boundary!':result+' run(s)!'}updateScore();if(target&&runs>=target){done=true;msg.textContent='TARGET CHASED! You win with '+(10-wickets)+' wicket(s) left.'}else if(balls>=maxBalls||wickets>=10){done=true;msg.textContent+=' INNINGS OVER — Final score '+runs+'/'+wickets+(target?' · '+(runs>=target?'Target reached!':'You lost the chase.'):'');}else setTimeout(bowl,650)}function bowl(){if(done||paused)return;ball={x:700,y:175+Math.random()*90,v:4.2+Math.random()*1.3};active=true}function hit(){if(done||paused)return;if(!active){msg.textContent='Wait for the bowled ball!';return}const gap=Math.abs(ball.x-165);if(gap<18)endBall(6);else if(gap<34)endBall(4);else if(gap<51)endBall(Math.random()<.5?2:1);else if(ball.x<235)endBall('wicket');else msg.textContent='Wait until the ball reaches your bat.'}function start(){runs=0;wickets=0;balls=0;maxBalls=Number(document.querySelector('#overs').value)*6;target=Number(document.querySelector('#target').value);done=false;paused=false;active=false;updateScore();msg.textContent='Bowler running in — time your shot!';bowl();draw()}document.querySelector('#start').onclick=start;document.querySelector('#hit').onclick=hit;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Resume':'Pause';if(!paused&&!done&&!active)bowl()};document.querySelector('#restart').onclick=start;addEventListener('keydown',e=>{if(e.code==='Space')hit()});function loop(){if(active&&!paused){ball.x-=ball.v;ball.y+=Math.sin((700-ball.x)/45)*.8;if(ball.x<115)endBall('wicket')}draw();requestAnimationFrame(loop)}updateScore();loop()})();</script></main></body></html>
