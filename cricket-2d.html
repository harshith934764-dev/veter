<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cricket 2D Batting</title><style>*{box-sizing:border-box}body{margin:0;background:#071b16;color:#fff;font:15px system-ui;display:grid;place-items:center;min-height:100vh;padding:12px}.box{width:min(940px,100%);background:#102b20;border:1px solid #315b49;border-radius:18px;padding:14px}a{color:#a9eed0}canvas{width:100%;display:block;border-radius:12px;background:#277d48;touch-action:manipulation;margin-top:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}button,select{border:0;border-radius:10px;padding:12px 16px;font-weight:900;background:#d9f99d;color:#142c1e}.score{font-weight:900;font-size:18px}small,.hint{color:#c2ddce}#menu{background:#1a4933;padding:12px;border-radius:12px;margin-top:12px}label{margin-right:10px}button:disabled{opacity:.5}</style></head><body><main class="box"><a href="/games.html">← Games</a><h1>🏏 Cricket 2D — Batting Challenge</h1><div class="score" id="score">0/0 · 0.0 overs</div><section id="menu"><label>Overs <select id="overs"><option>1</option><option>2</option><option selected>5</option><option>10</option><option>20</option></select></label><label>Target <select id="target"><option value="0">Set your score</option><option>10</option><option>20</option><option>30</option><option>50</option><option>75</option></select></label><button id="start">Start innings</button><p class="hint">11-player batting lineup is randomized each match. 6 legal balls per over. Wides/no-balls add extras and do not use a legal ball. 10 wickets ends the innings.</p><div id="lineup" class="hint"></div></section><canvas id="c" width="850" height="460"></canvas><div class="row"><button id="hit">🏏 PLAY SHOT</button><button id="pause">Pause</button><button id="restart">Restart</button></div><p id="msg" class="hint">Start your innings. Watch the ball and time your shot!</p></main><script>(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),score=document.querySelector('#score'),msg=document.querySelector('#msg'),lineup=document.querySelector('#lineup');let runs=0,wickets=0,legal=0,maxLegal=30,target=0,active=false,paused=false,done=true,ball={x:700,y:210,speed:5},lastResult='',players=[],striker=0,anim=0;const names=['Aarav','Vihaan','Aditya','Arjun','Reyansh','Ishaan','Kabir','Rohan','Dev','Krish','Sai'];function update(){score.textContent=runs+'/'+wickets+' · '+Math.floor(legal/6)+'.'+legal%6+' overs'+(target?' · Target '+target:'');lineup.textContent='Batting order: '+players.map((n,i)=>(i===striker?'▶ ':'')+n).join(' · ')}function draw(){g.clearRect(0,0,850,460);g.fillStyle='#287d49';g.fillRect(0,0,850,460);for(let i=0;i<8;i++){g.fillStyle=i%2?'#2c854e':'#267644';g.fillRect(i*110,0,110,460)}g.fillStyle='#c7a16c';g.fillRect(310,35,230,390);g.fillStyle='#e5c998';g.fillRect(365,45,120,370);g.strokeStyle='white';g.lineWidth=3;g.strokeRect(365,45,120,370);g.fillStyle='#fff';g.font='bold 19px system-ui';g.fillText('BOWLER',690,180);g.fillStyle='#e84d4d';g.beginPath();g.arc(ball.x,ball.y,11,0,7);g.fill();g.fillStyle='#153d2a';g.fillRect(160,205,30,65);g.fillStyle='#efbd8c';g.beginPath();g.arc(175,192,14,0,7);g.fill();g.strokeStyle='#f0d3a2';g.lineWidth=9;g.beginPath();g.moveTo(180,225);g.lineTo(215,anim%2?205:235);g.stroke();g.fillStyle='#fff';g.font='bold 17px system-ui';g.fillText('Score '+runs+'/'+wickets,20,30);g.fillText('Overs '+Math.floor(legal/6)+'.'+legal%6+'/'+maxLegal/6,20,55);if(done){g.fillStyle='rgba(0,0,0,.65)';g.fillRect(0,0,850,460);g.fillStyle='white';g.font='bold 28px system-ui';g.fillText('INNINGS READY / COMPLETE',210,230)}}function endInnings(){done=true;active=false;msg.textContent='INNINGS OVER — '+runs+'/'+wickets+'. '+(target?(runs>=target?'Target achieved! You win!':'Target not reached.'):'Your final batting score.');update()}function nextBall(){if(done||paused)return;active=true;ball={x:720,y:170+Math.random()*115,speed:4.5+Math.random()*2};msg.textContent='Bowler delivers! Tap PLAY SHOT near the batter.'}function finish(result,legalBall=true){active=false;if(result==='W'){wickets++;msg.textContent='WICKET! '+players[striker]+' is out.';striker++;}else{runs+=result;msg.textContent=result+' run'+(result===1?'':'s')+' scored!'}if(legalBall)legal++;if(target&&runs>=target){endInnings();return}if(wickets>=10||legal>=maxLegal){endInnings();return}update();setTimeout(nextBall,850)}function hit(){if(done||paused)return;if(!active){msg.textContent='Wait for the bowler to deliver.';return}const d=Math.abs(ball.x-210);if(d>105){msg.textContent='Too early! Wait for the ball.';return}let r;if(d<22)r=Math.random()<.25?6:Math.random()<.55?4:Math.random()<.8?2:1;else if(d<48)r=[1,2,4,0,6][Math.floor(Math.random()*5)];else if(d<78)r=Math.random()<.4?'W':[0,1,2][Math.floor(Math.random()*3)];else r=Math.random()<.65?'W':0;finish(r)}function start(){runs=0;wickets=0;legal=0;maxLegal=Number(document.querySelector('#overs').value)*6;target=Number(document.querySelector('#target').value);players=[...names].sort(()=>Math.random()-.5);striker=0;done=false;paused=false;active=false;document.querySelector('#menu').style.opacity='.8';update();draw();msg.textContent='Innings started! First ball coming.';setTimeout(nextBall,700)}document.querySelector('#start').onclick=start;document.querySelector('#hit').onclick=hit;document.querySelector('#restart').onclick=start;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Resume':'Pause';if(!paused&&!active&&!done)nextBall()};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();hit()}});function loop(){if(active&&!paused){ball.x-=ball.speed;anim++;if(ball.x<155)finish('W')}draw();requestAnimationFrame(loop)}update();loop()})();</script></main></body></html>
